<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMORI Orange Oasis Stitcher</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd;
         display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

  /* Sidebar */
  aside { background: #222; border-right: 1px solid #444; overflow-y: auto; padding: 8px; }
  aside h2 { margin: 4px 0 8px; font-size: 14px; color: #aaa; }
  .map-thumb { display: flex; gap: 8px; padding: 6px; margin-bottom: 4px;
               background: #2a2a2a; border-radius: 4px; cursor: grab; align-items: center; }
  .map-thumb:hover { background: #333; }
  .map-thumb.placed { opacity: 0.4; }
  .map-thumb img { width: 40px; height: 40px; object-fit: contain; background: #111; flex-shrink: 0; }
  .map-thumb .meta { font-size: 11px; line-height: 1.3; min-width: 0; }
  .map-thumb .meta .id { color: #ff80c0; font-weight: bold; }
  .map-thumb .meta .name { color: #aaa; word-break: break-word; }

  /* Toolbar */
  .toolbar { padding: 6px; border-bottom: 1px solid #333; background: #1a1a1a;
             display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .toolbar button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 10px; cursor: pointer; }
  .toolbar button:hover { background: #333; }
  .toolbar input { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px; }
  .toolbar .info { color: #888; margin-left: auto; font-family: monospace; }

  /* Canvas viewport */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #viewport { flex: 1; overflow: hidden; position: relative;
              background: #0a0a0a;
              background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
              background-size: 32px 32px;
              cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .placed-map { position: absolute; cursor: move;
                background-repeat: no-repeat; }
  .placed-map.selected { outline: 2px solid #ff80c0; z-index: 100; }
  .placed-map .label { position: absolute; left: 4px; top: 4px;
                        background: rgba(0,0,0,0.7); color: #fff;
                        padding: 2px 6px; font-size: 11px; border-radius: 3px;
                        pointer-events: none; }
  .placed-map .ctrl-bar { position: absolute; right: 4px; top: 4px;
                          background: rgba(0,0,0,0.8); border-radius: 3px;
                          display: flex; gap: 0; padding: 1px;
                          font-size: 10px; }
  .placed-map .ctrl-bar button { background: #444; color: #ddd; border: none;
                                 padding: 2px 6px; cursor: pointer; }
  .placed-map .ctrl-bar button:hover { background: #666; }
  .placed-map .ctrl-bar button.active { background: #ff80c0; color: #000; }
  .placed-map .ctrl-bar .sep { width: 1px; background: #222; margin: 0 2px; }

  /* Watermelon overlays — pulse + thick bright glow */
  .watermelon-overlay { position: absolute; width: 32px; height: 32px;
                        background-size: contain; image-rendering: pixelated;
                        background-repeat: no-repeat;
                        animation: melon-pulse 1.4s ease-in-out infinite;
                        pointer-events: none; z-index: 200; }
  .watermelon-overlay.green { background-image: url('assets/watermelon.png');
                              filter: drop-shadow(0 0 10px #6cff33)
                                      drop-shadow(0 0 22px #6cff33)
                                      drop-shadow(0 0 34px #6cff33); }
  .watermelon-overlay.blue  { background-image: url('assets/watermelon_blue.png');
                              filter: drop-shadow(0 0 10px #33ccff)
                                      drop-shadow(0 0 22px #33ccff)
                                      drop-shadow(0 0 34px #33ccff); }
  @keyframes melon-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  .watermelons-off .watermelon-overlay { display: none; }
</style>
</head>
<body>

<aside>
  <h2>ORANGE OASIS MAPS</h2>
  <div id="thumbList"></div>
</aside>

<main>
  <div class="toolbar">
    <button id="saveBtn">Save layout (JSON)</button>
    <button id="loadBtn">Load layout</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" />
    <button id="exportBtn">Export PNG</button>
    <button id="autoBtn">⚡ Auto-Place</button>
    <button id="clearBtn">Clear all</button>
    <button id="resetBtn">Reset view</button>
    <button id="melonBtn">🍉 Watermelons</button>
    <span class="info">
      zoom: <span id="zoomLabel">100%</span>
      &nbsp;|&nbsp;
      placed: <span id="placedLabel">0/0</span>
      &nbsp;|&nbsp;
      <span style="color:#666">drag · Shift+drag = 1px · ←↑↓→ = nudge · [ / ] = back / front</span>
    </span>
  </div>
  <div id="viewport">
    <div id="world"></div>
  </div>
</main>

<script>
const TILE_PX = 32;

// Orange Oasis map IDs.
const MAP_IDS = [
  106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 122,
  328, 332, 333, 334, 342, 343, 344, 3441, 3442, 3443, 345, 452,
  1121, 1122, 1123, 1124,  // OASIS INTERIORS sub-rooms
];

// Manual nudges applied AFTER auto-place. Add per-map { dx, dy } as needed.
const MANUAL_NUDGES = {
  // (empty — fill in after first auto-place run if some maps are off)
};

// State
let mapMeta = null;
let placed = {}; // mapId -> {x, y, crop}  (crop is 'full' | 'top3' | 'mid3' | 'bot3')
let zoom = 0.5;
let panX = 0, panY = 0;

// Junkyard maps don't have day/sunset/night phases — all show 'full'.
function defaultCrop(meta) {
  return 'full';
}

// Junkyard has no 3-stripe streets, so no black-band trimming needed.
const STREET_BLACK_BAND = {};

function cropRect(crop, meta, id) {
  // Returns {y, h} in tiles for the crop window (top-left + height)
  let r;
  if (crop === 'top3')      r = { y: 0,                     h: meta.height / 3 };
  else if (crop === 'mid3') r = { y: meta.height / 3,       h: meta.height / 3 };
  else if (crop === 'bot3') r = { y: meta.height * 2 / 3,   h: meta.height / 3 };
  else                      r = { y: 0,                     h: meta.height };
  // Trim street black bands (top + bottom)
  const band = STREET_BLACK_BAND[id]?.[crop];
  if (band) { r.y += band[0]; r.h -= band[0] + band[1]; }
  return r;
}

// Z-order helpers
function allZOrders() {
  return Object.values(placed).map(p => p.zOrder ?? 0);
}
function nextZOrder() {
  const zs = allZOrders();
  return zs.length === 0 ? 0 : Math.max(...zs) + 1;
}
function prevZOrder() {
  const zs = allZOrders();
  return zs.length === 0 ? 0 : Math.min(...zs) - 1;
}
function bringToFront(id) {
  if (!placed[id]) return;
  placed[id].zOrder = nextZOrder();
  renderPlaced();
  // restore selected highlight
  const el = world.querySelector(`.placed-map[data-id="${id}"]`);
  if (el) el.classList.add('selected');
}
function sendToBack(id) {
  if (!placed[id]) return;
  placed[id].zOrder = prevZOrder();
  renderPlaced();
  const el = world.querySelector(`.placed-map[data-id="${id}"]`);
  if (el) el.classList.add('selected');
}

const $ = id => document.getElementById(id);
const world = $('world');
const viewport = $('viewport');

let edges = null;

let highlights = { watermelons: [] };

async function init() {
  const [metaRes, edgesRes, hlRes] = await Promise.all([
    fetch('../data/orange_oasis_maps.json'),
    fetch('../data/orange_oasis_edges.json'),
    fetch('../data/orange_oasis_highlights.json'),
  ]);
  mapMeta = await metaRes.json();
  edges = await edgesRes.json();
  highlights = await hlRes.json();

  renderThumbs();
  applyTransform();
  updatePlacedLabel();

  setupViewportPan();
  setupViewportZoom();
  setupGlobalKeys();

  $('saveBtn').onclick = saveLayout;
  $('loadBtn').onclick = () => $('loadFile').click();
  $('loadFile').onchange = loadLayout;
  $('exportBtn').onclick = exportPNG;
  $('resetBtn').onclick = resetView;
  $('autoBtn').onclick = autoPlace;
  $('clearBtn').onclick = clearAll;
  $('melonBtn').onclick = () => {
    world.classList.toggle('watermelons-off');
    $('melonBtn').textContent =
      world.classList.contains('watermelons-off') ? '🍉 Watermelons' : '🍉 ✓';
  };
  // Default: show watermelons (toggle off = hidden)
  $('melonBtn').textContent = '🍉 ✓';
}

function renderWatermelons() {
  world.querySelectorAll('.watermelon-overlay').forEach(n => n.remove());
  for (const m of highlights.watermelons || []) {
    const pos = placed[m.mapId];
    if (!pos) continue;
    const el = document.createElement('div');
    el.className = 'watermelon-overlay ' + (m.color || 'green');
    el.dataset.mapId = m.mapId;  // tag for fast lookup on drag
    el.style.left = (pos.x + m.x * TILE_PX) + 'px';
    el.style.top  = (pos.y + m.y * TILE_PX) + 'px';
    el.dataset.localX = m.x * TILE_PX;
    el.dataset.localY = m.y * TILE_PX;
    el.title = `${m.color || 'green'} watermelon @ Map${m.mapId} (${m.x}, ${m.y}) — ${m.name}`;
    world.appendChild(el);
  }
}

// Move watermelons belonging to one map (used by drag / nudge — avoids full rerender)
function updateWatermelonsForMap(mapId) {
  const pos = placed[mapId];
  if (!pos) return;
  world.querySelectorAll(`.watermelon-overlay[data-map-id="${mapId}"]`).forEach(el => {
    el.style.left = (pos.x + (+el.dataset.localX)) + 'px';
    el.style.top  = (pos.y + (+el.dataset.localY)) + 'px';
  });
}

function clearAll() {
  if (Object.keys(placed).length === 0) return;
  if (!confirm('Clear all placed maps?')) return;
  placed = {};
  renderPlaced();
  renderThumbs();
  updatePlacedLabel();
}

// 3-stripe street maps store Day/Sunset/Night vertically: 0-29 / 30-59 / 60-89.
// Detect via height >= 60 && multiple of 30.
function isStripe(mapId) {
  const m = mapMeta[mapId]; if (!m) return false;
  return m.height >= 60 && m.height % 30 === 0;
}

// Crop offset (rows) for a map at given phase, accounting for STREET_BLACK_BAND
// top trim. This is what BFS uses to align transfer tiles in the cropped view.
function cropOffsetRows(mapId, phase) {
  if (!isStripe(mapId)) return 0;
  const cropKey = phase === 'sunset' ? 'mid3' : phase === 'night' ? 'bot3' : 'top3';
  const baseY = phase === 'sunset' ? 30 : phase === 'night' ? 60 : 0;
  const band = STREET_BLACK_BAND[mapId]?.[cropKey];
  return baseY + (band ? band[0] : 0);
}

function cropName(mapId, phase) {
  if (!isStripe(mapId)) return 'full';
  if (phase === 'sunset') return 'mid3';
  if (phase === 'night')  return 'bot3';
  return 'top3';
}

// Does this transfer endpoint belong to the given phase?
function endpointMatchesPhase(mapId, y, phase) {
  const m = mapMeta[mapId]; if (!m) return false;
  if (isStripe(mapId)) {
    if (phase === 'day')    return y < 30;
    if (phase === 'sunset') return y >= 30 && y < 60;
    if (phase === 'night')  return y >= 60;
  }
  // Single-phase maps: classify by name suffix
  const name = m.name;
  if (phase === 'sunset') return /\(SUNSET\)/i.test(name);
  if (phase === 'night')  return /\(NIGHT\)/i.test(name);
  // 'day' = explicit (DAY) OR no phase suffix at all
  return /\(DAY\)/i.test(name) || !/\((SUNSET|NIGHT)\)/i.test(name);
}

// Auto-place reachable maps by BFS using transfer offsets.
function autoPlace() {
  if (!edges) { alert('Edges not loaded yet.'); return; }
  // Junkyard has no phases — use a fixed marker so cropOffsetRows returns 0.
  const phase = 'day';

  // Filter edges to MAP_IDS only.
  const phaseEdges = (edges.internal || []).filter(e =>
    MAP_IDS.includes(e.from.mapId) && MAP_IDS.includes(e.to.mapId)
  );

  // Build adjacency. For an edge A(ax, ay) → B(bx, by) with crop offsets coA/coB,
  // place B at A's pos + (ax - bx, (ay - coA) - (by - coB)) tiles so the two
  // transfer tiles overlap in world coordinates.
  //
  // Each transfer edge is added in BOTH traversal directions so BFS can pick
  // either map as the "approach" side. We tag each entry with `dataFromIsTo`
  // (true when the edge in data has from=neighbor map): RPG MV has 1-tile
  // exit-vs-arrival asymmetry, and using the neighbor's forward edge (the one
  // describing entry INTO the current map) gives more natural alignment.
  const adj = {};
  for (const e of phaseEdges) {
    const a = e.from.mapId, b = e.to.mapId;
    const coA = cropOffsetRows(a, phase);
    const coB = cropOffsetRows(b, phase);
    const dx = e.from.x - e.to.x;
    const dy = (e.from.y - coA) - (e.to.y - coB);
    // Forward (BFS at A reaches B via A→B edge): dataFromIsTo = false (A is from)
    (adj[a] = adj[a] || []).push({ to: b, dx, dy, dataFromIsTo: false });
    // Reverse (BFS at B reaches A via the SAME edge): dataFromIsTo = true (A is from, but we're at B)
    (adj[b] = adj[b] || []).push({ to: a, dx: -dx, dy: -dy, dataFromIsTo: true });
  }
  // Sort each adj[A] to prefer entries where the data's `from` is the neighbor
  // (dataFromIsTo === true), i.e., the neighbor's forward direction.
  for (const id in adj) {
    adj[id].sort((p, q) => (q.dataFromIsTo ? 1 : 0) - (p.dataFromIsTo ? 1 : 0));
  }

  // Anchor: first currently-placed map, else Map 142 (JUNKYARD I) at origin.
  let anchorId;
  if (Object.keys(placed).length > 0) {
    anchorId = +Object.keys(placed)[0];
  } else {
    anchorId = 106;  // ORANGE OASIS
    placed[anchorId] = { x: 0, y: 0, crop: 'full', zOrder: 0 };
  }

  const queue = [anchorId];
  const visited = new Set([anchorId]);
  let added = 0;
  while (queue.length) {
    const cur = queue.shift();
    if (!adj[cur]) continue;
    const curPos = placed[cur];
    for (const e of adj[cur]) {
      if (visited.has(e.to)) continue;
      visited.add(e.to);
      if (placed[e.to]) { queue.push(e.to); continue; }
      placed[e.to] = {
        x: curPos.x + e.dx * TILE_PX,
        y: curPos.y + e.dy * TILE_PX,
        crop: cropName(e.to, phase),
        zOrder: nextZOrder(),
      };
      added++;
      queue.push(e.to);
    }
  }

  // Apply manual nudges to fix maps where transfer alignment differs from
  // desired visual layout (e.g., Lake covered too much by Park).
  for (const id of Object.keys(placed)) {
    const nudge = MANUAL_NUDGES[id];
    if (!nudge) continue;
    placed[id].x += (nudge.dx || 0) * TILE_PX;
    placed[id].y += (nudge.dy || 0) * TILE_PX;
  }

  // Reassign z-order so maps further south (larger y) render on top. This makes
  // Park cover Lake's southern edge, Shopping cover Lake's east edge, etc.
  const ids = Object.keys(placed).sort((a, b) =>
    (placed[a].y - placed[b].y) || (placed[a].x - placed[b].x)
  );
  ids.forEach((id, i) => { placed[id].zOrder = i; });

  renderPlaced();
  renderThumbs();
  updatePlacedLabel();
  alert(`Auto-placed ${added} new map(s). Anchor: Map ${anchorId}.`);
}

function renderThumbs() {
  const list = $('thumbList');
  list.innerHTML = '';
  for (const id of MAP_IDS) {
    const m = mapMeta[id];
    if (!m) continue;
    const div = document.createElement('div');
    div.className = 'map-thumb';
    div.dataset.id = id;
    div.innerHTML = `
      <img src="../data/raw_pngs/map${id}.png" />
      <div class="meta">
        <div class="id">Map ${id}</div>
        <div class="name">${m.name.replace(/^[- ]+/, '')}</div>
        <div style="color:#666">${m.width}×${m.height}</div>
      </div>`;
    div.draggable = true;
    div.addEventListener('dragstart', e => {
      e.dataTransfer.setData('mapId', id);
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('click', () => {
      // toggle placement: if not placed, place at viewport center
      if (placed[id]) {
        delete placed[id];
        renderPlaced();
        renderThumbs();
        updatePlacedLabel();
      } else {
        const cx = (-panX + viewport.clientWidth / 2) / zoom;
        const cy = (-panY + viewport.clientHeight / 2) / zoom;
        const m = mapMeta[id];
        const crop = defaultCrop(m);
        const cropH = cropRect(crop, m, id).h;
        placed[id] = {
          x: Math.round((cx - m.width * TILE_PX / 2) / TILE_PX) * TILE_PX,
          y: Math.round((cy - cropH * TILE_PX / 2) / TILE_PX) * TILE_PX,
          crop,
          zOrder: nextZOrder(),
        };
        renderPlaced();
        renderThumbs();
        updatePlacedLabel();
      }
    });
    if (placed[id]) div.classList.add('placed');
    list.appendChild(div);
  }
}

function renderPlaced() {
  // remove all .placed-map nodes
  world.querySelectorAll('.placed-map').forEach(n => n.remove());
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  // sort by zOrder ascending — last-rendered = on top
  const idsSorted = Object.keys(placed).sort((a, b) => (placed[a].zOrder ?? 0) - (placed[b].zOrder ?? 0));
  for (const id of idsSorted) {
    const m = mapMeta[id];
    const pos = placed[id];
    const crop = pos.crop || 'full';
    const cr = cropRect(crop, m, id);
    const w = m.width * TILE_PX;
    const fullH = m.height * TILE_PX;
    const cropH = cr.h * TILE_PX;
    const cropOffsetY = cr.y * TILE_PX;
    const div = document.createElement('div');
    div.className = 'placed-map';
    div.style.left = pos.x + 'px';
    div.style.top = pos.y + 'px';
    div.style.width = w + 'px';
    div.style.height = cropH + 'px';
    div.style.backgroundImage = `url(../data/raw_pngs/map${id}.png)`;
    div.style.backgroundSize = `${w}px ${fullH}px`;
    div.style.backgroundPosition = `0 -${cropOffsetY}px`;
    div.dataset.id = id;

    // ctrl bar = order buttons + (optional) crop buttons
    const showCropBar = m.height >= 60;
    const cropBtns = showCropBar
      ? `<button data-crop="top3" class="${crop==='top3'?'active':''}">Day</button>
         <button data-crop="mid3" class="${crop==='mid3'?'active':''}">Sunset</button>
         <button data-crop="bot3" class="${crop==='bot3'?'active':''}">Night</button>
         <button data-crop="full" class="${crop==='full'?'active':''}">Full</button>
         <span class="sep"></span>`
      : '';
    const ctrlBar = `<div class="ctrl-bar">
        ${cropBtns}
        <button data-order="back" title="Send to back">↓</button>
        <button data-order="front" title="Bring to front">↑</button>
      </div>`;

    div.innerHTML = `<div class="label">Map ${id}: ${m.name.replace(/^[- ]+/, '')} @ (${pos.x}, ${pos.y}) ${crop !== 'full' ? '['+crop+']' : ''}</div>${ctrlBar}`;
    setupDrag(div, id);
    setupCtrlButtons(div, id);
    world.appendChild(div);
    minX = Math.min(minX, pos.x); minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + w); maxY = Math.max(maxY, pos.y + cropH);
  }
  world.dataset.minX = minX === Infinity ? 0 : minX;
  world.dataset.minY = minY === Infinity ? 0 : minY;
  world.dataset.maxX = maxX === -Infinity ? 0 : maxX;
  world.dataset.maxY = maxY === -Infinity ? 0 : maxY;
  renderWatermelons();
}

function setupCtrlButtons(el, id) {
  el.querySelectorAll('.ctrl-bar button').forEach(btn => {
    btn.addEventListener('mousedown', e => e.stopPropagation()); // don't start drag
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (btn.dataset.crop) {
        placed[id].crop = btn.dataset.crop;
        renderPlaced();
      } else if (btn.dataset.order === 'front') {
        bringToFront(id);
      } else if (btn.dataset.order === 'back') {
        sendToBack(id);
      }
    });
  });
}

function setupDrag(el, id) {
  let dragging = false, sx, sy, ox, oy, shiftHeld = false, dragGroup = [];
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    // Selection logic: shift = toggle, plain click on already-selected = keep selection,
    // plain click on unselected = select only this (or this map's group)
    const wasSelected = el.classList.contains('selected');
    if (e.shiftKey) {
      el.classList.toggle('selected');
      return;  // selection-only, don't start drag on shift+click
    } else if (!wasSelected) {
      document.querySelectorAll('.placed-map.selected, .route-dot.selected').forEach(n => n.classList.remove('selected'));
      // If part of an imported group, select whole group (unless Alt to break)
      const groupId = placed[id].groupId;
      if (groupId && !e.altKey) {
        Object.keys(placed).filter(gid => placed[gid].groupId === groupId).forEach(gid => {
          world.querySelector(`.placed-map[data-id="${gid}"]`)?.classList.add('selected');
        });
      } else {
        el.classList.add('selected');
      }
    }
    // Begin drag of ALL currently-selected items (maps + route dots)
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    dragGroup = [];
    document.querySelectorAll('.placed-map.selected').forEach(n => {
      const gid = n.dataset.id;
      dragGroup.push({ kind: 'map', id: gid, ox: placed[gid].x, oy: placed[gid].y, el: n });
    });
    document.querySelectorAll('.route-dot.selected').forEach(n => {
      const ri = +n.dataset.routeIdx, pi = +n.dataset.ptIdx;
      dragGroup.push({ kind: 'dot', ri, pi, ox: routes[ri].pts[pi].x, oy: routes[ri].pts[pi].y, el: n });
    });
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = (e.clientX - sx) / zoom;
    const dy = (e.clientY - sy) / zoom;
    // Tile-snap based on the first map item; if first is a route dot use 1px
    const anchor = dragGroup[0];
    const snap = anchor.kind === 'map' ? TILE_PX : 1;
    const nx0 = Math.round((anchor.ox + dx) / snap) * snap;
    const ny0 = Math.round((anchor.oy + dy) / snap) * snap;
    const ddx = nx0 - anchor.ox, ddy = ny0 - anchor.oy;
    const movedMapIds = new Set();
    for (const g of dragGroup) {
      const nx = g.ox + ddx, ny = g.oy + ddy;
      if (g.kind === 'map') {
        placed[g.id].x = nx; placed[g.id].y = ny;
        if (g.el) {
          g.el.style.left = nx + 'px'; g.el.style.top = ny + 'px';
          const cropTag = (placed[g.id].crop && placed[g.id].crop !== 'full') ? ` [${placed[g.id].crop}]` : '';
          g.el.querySelector('.label').textContent =
            `Map ${g.id}: ${mapMeta[g.id].name.replace(/^[- ]+/,'')} @ (${nx}, ${ny})${cropTag}`;
        }
        updateWatermelonsForMap(g.id);
        movedMapIds.add(String(g.id));
      } else if (g.kind === 'dot') {
        routes[g.ri].pts[g.pi].x = nx; routes[g.ri].pts[g.pi].y = ny;
        if (g.el) { g.el.style.left = (nx-20)+'px'; g.el.style.top = (ny-20)+'px'; }
        // Also update line
        const svg = document.getElementById('routesSvg');
        const line = svg?.children[g.ri];
        if (line) {
          line.setAttribute(g.pi === 0 ? 'x1' : 'x2', nx + 2000);
          line.setAttribute(g.pi === 0 ? 'y1' : 'y2', ny + 2000);
        }
      }
    }
    if (movedMapIds.size) updateRoutesForMovedMaps(movedMapIds);
  });
  window.addEventListener('mouseup', () => { dragging = false; dragGroup = []; });
}

function setupViewportPan() {
  // Marquee selection
  let marquee = null;  // { sx, sy, el }
  viewport.addEventListener('mousedown', e => {
    if (e.target !== viewport && e.target !== world) return;
    if (e.button !== 0) return;
    if (!e.shiftKey) {
      document.querySelectorAll('.placed-map.selected, .route-dot.selected').forEach(n => n.classList.remove('selected'));
    }
    const rect = viewport.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const div = document.createElement('div');
    div.style.cssText = 'position:absolute;border:1.5px dashed #80c0ff;background:rgba(128,192,255,0.10);pointer-events:none;z-index:9999;';
    viewport.appendChild(div);
    marquee = { sx, sy, el: div, addMode: e.shiftKey };
  });
  window.addEventListener('mousemove', e => {
    if (!marquee) return;
    const rect = viewport.getBoundingClientRect();
    const ex = e.clientX - rect.left, ey = e.clientY - rect.top;
    const x0 = Math.min(marquee.sx, ex), y0 = Math.min(marquee.sy, ey);
    const w = Math.abs(ex - marquee.sx), h = Math.abs(ey - marquee.sy);
    Object.assign(marquee.el.style, { left: x0+'px', top: y0+'px', width: w+'px', height: h+'px' });
    // Convert marquee rect to world coords
    const wx0 = (x0 - panX) / zoom, wy0 = (y0 - panY) / zoom;
    const wx1 = wx0 + w / zoom, wy1 = wy0 + h / zoom;
    // Maps: select if their bbox intersects marquee
    for (const id in placed) {
      const m = mapMeta[id]; if (!m) continue;
      const p = placed[id];
      const mw = m.width * TILE_PX, mh = m.height * TILE_PX;
      const hit = !(p.x+mw < wx0 || p.x > wx1 || p.y+mh < wy0 || p.y > wy1);
      const el = world.querySelector(`.placed-map[data-id="${id}"]`);
      if (!el) continue;
      if (hit) el.classList.add('selected');
      else if (!marquee.addMode) el.classList.remove('selected');
    }
    // Route dots: same hit test
    document.querySelectorAll('.route-dot').forEach(dot => {
      const ri = +dot.dataset.routeIdx, pi = +dot.dataset.ptIdx;
      const r = routes[ri]; if (!r) return;
      const px = r.pts[pi].x, py = r.pts[pi].y;
      const hit = px >= wx0 && px <= wx1 && py >= wy0 && py <= wy1;
      if (hit) dot.classList.add('selected');
      else if (!marquee.addMode) dot.classList.remove('selected');
    });
  });
  window.addEventListener('mouseup', () => {
    if (marquee) { marquee.el.remove(); marquee = null; }
  });
}

function setupViewportZoom() {
  // Wheel: trackpad two-finger swipe = pan; pinch (ctrlKey true) or cmd+wheel = zoom.
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // ZOOM
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
      zoom = Math.max(0.05, Math.min(8, zoom * factor));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    } else {
      // PAN
      panX -= e.deltaX;
      panY -= e.deltaY;
    }
    applyTransform();
  }, { passive: false });
}

function setupGlobalKeys() {
  window.addEventListener('keydown', e => {
    // Delete selected
    if (e.key === 'Delete' || e.key === 'Backspace') {
      // Collect all selected items
      const selDots = [...world.querySelectorAll('.route-dot.selected')];
      const selMaps = [...world.querySelectorAll('.placed-map.selected')];
      // Routes: unique route indices (each route has 2 dots), delete from highest idx first
      const routeIdxsToDelete = [...new Set(selDots.map(d => +d.dataset.routeIdx))].sort((a,b)=>b-a);
      for (const ri of routeIdxsToDelete) routes.splice(ri, 1);
      // Maps
      for (const el of selMaps) delete placed[el.dataset.id];
      if (selDots.length || selMaps.length) {
        renderPlaced(); renderRoutes(); renderThumbs(); updatePlacedLabel();
      }
      return;
    }
    if (e.key === '0') { resetView(); return; }

    const sel = world.querySelector('.placed-map.selected');
    if (!sel) return;
    const id = sel.dataset.id;

    // Z-order shortcuts
    if (e.key === ']') { e.preventDefault(); bringToFront(id); return; }
    if (e.key === '[') { e.preventDefault(); sendToBack(id); return; }

    // Arrow keys: nudge ALL selected maps by 1 tile
    const step = TILE_PX;
    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft')  dx = -step;
    else if (e.key === 'ArrowRight') dx = step;
    else if (e.key === 'ArrowUp')    dy = -step;
    else if (e.key === 'ArrowDown')  dy = step;
    else return;
    e.preventDefault();
    const movedMapIds = new Set();
    document.querySelectorAll('.placed-map.selected').forEach(n => {
      const gid = n.dataset.id;
      placed[gid].x += dx; placed[gid].y += dy;
      n.style.left = placed[gid].x + 'px'; n.style.top = placed[gid].y + 'px';
      const cropTag = (placed[gid].crop && placed[gid].crop !== 'full') ? ` [${placed[gid].crop}]` : '';
      n.querySelector('.label').textContent =
        `Map ${gid}: ${mapMeta[gid].name.replace(/^[- ]+/,'')} @ (${placed[gid].x}, ${placed[gid].y})${cropTag}`;
      updateWatermelonsForMap(gid);
      movedMapIds.add(String(gid));
    });
    if (movedMapIds.size) updateRoutesForMovedMaps(movedMapIds);
  });
}

// Route stubs (this stitcher has no transfer routes yet).
let routes = [];
function renderRoutes() {}
function updateRoutesForMovedMaps() {}

function applyTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  const zl = $('zoomLabel'); if (zl) zl.textContent = Math.round(zoom * 100) + '%';
}

function resetView() {
  // fit all placed maps
  if (Object.keys(placed).length === 0) {
    panX = 0; panY = 0; zoom = 0.5;
  } else {
    const minX = +world.dataset.minX, minY = +world.dataset.minY;
    const maxX = +world.dataset.maxX, maxY = +world.dataset.maxY;
    const w = maxX - minX, h = maxY - minY;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    zoom = Math.min(vw / w, vh / h) * 0.9;
    panX = vw / 2 - (minX + w / 2) * zoom;
    panY = vh / 2 - (minY + h / 2) * zoom;
  }
  applyTransform();
}

function updatePlacedLabel() {
  $('placedLabel').textContent = `${Object.keys(placed).length}/${MAP_IDS.length}`;
}

function saveLayout() {
  const data = {
    version: 1,
    layout: placed,
    maps: Object.fromEntries(
      Object.keys(placed).map(id => [id, mapMeta[id]])
    ),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'faraway_layout.json';
  a.click();
}

function loadLayout(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const data = JSON.parse(reader.result);
    placed = data.layout || {};
    renderPlaced();
    renderThumbs();
    updatePlacedLabel();
    resetView();
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function exportPNG() {
  if (Object.keys(placed).length === 0) {
    alert('Place at least one map first.');
    return;
  }

  // Recompute bounds fresh from current placed state (world.dataset may be
  // stale if user moved maps via drag/arrow keys).
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const id of Object.keys(placed)) {
    const m = mapMeta[id];
    const pos = placed[id];
    const cr = cropRect(pos.crop || 'full', m, id);
    const w = m.width * TILE_PX;
    const cropH = cr.h * TILE_PX;
    minX = Math.min(minX, pos.x);
    minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + w);
    maxY = Math.max(maxY, pos.y + cropH);
  }
  const cw = maxX - minX, ch = maxY - minY;

  const canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');

  // Sort by zOrder ascending so higher zOrder renders on top (matches editor).
  const idsSorted = Object.keys(placed).sort(
    (a, b) => (placed[a].zOrder ?? 0) - (placed[b].zOrder ?? 0)
  );
  for (const id of idsSorted) {
    const pos = placed[id];
    const m = mapMeta[id];
    const cr = cropRect(pos.crop || 'full', m, id);
    const img = new Image();
    img.src = `../data/raw_pngs/map${id}.png`;
    await new Promise(r => { img.onload = r; img.onerror = r; });
    // Some PNGs from goats.dev don't match meta dims exactly (e.g. map64 LAKE
    // is 1408px tall but meta says 1440px). Match the preview's CSS
    // `backgroundSize: w × fullH` behavior by scaling source to meta dims.
    const expH = m.height * TILE_PX;
    const syScale = img.height / expH;
    ctx.drawImage(
      img,
      0, cr.y * TILE_PX * syScale, img.width, cr.h * TILE_PX * syScale,
      pos.x - minX, pos.y - minY, m.width * TILE_PX, cr.h * TILE_PX
    );
  }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'stitched_faraway.png';
    a.click();
  });
}

init();
</script>
