  const head = document.createElement('div');
  head.innerHTML = `${title}<br><span class="where">Map${p.mapId} @ (${p.x}, ${p.y})</span>${what}` +
                   clueNote(p) + requiresNote(p);
  const btn = document.createElement('button');
  const paint = () => {
    const done = collected.has(key);
    btn.textContent = done ? `↺ ${t('marked')}` : `✓ ${t('markAs')}`;
    btn.className = done ? 'done' : '';
  };
  btn.addEventListener('click', () => {
    if (collected.has(key)) collected.delete(key); else collected.add(key);
    saveCollected();
    paint();
    // Redraw so the pin greys out; a tick later so the popup's own click is
    // finished with the marker before it is replaced.
    setTimeout(renderMarkers, 0);
  });
  paint();
  box.append(head, btn);
  return box;
}

function pinMarker(lat, lng, cfg, html, extra, art, aspect, height) {
  const h = height || cfg.size, w = Math.round(h * (aspect || cfg.wide || 1));
  const face = art
    ? `<img src="${art}" width="${w}" height="${h}" alt="">`
    : cfg.icon;
  const icon = L.divIcon({
    className: '', html: `<div class="pin ${extra || ''}" style="font-size:${h}px;` +
      `width:${w}px;height:${h}px">${face}</div>`,
    iconSize: [w, h], iconAnchor: [w / 2, h / 2],
  });
  const marker = L.marker([lat, lng], { icon });
  marker.bindTooltip(html, { className: 'melon-tooltip', direction: 'top',
                             offset: [0, -cfg.size / 2], sticky: false });
  return marker;
}

// How many screen pixels one map pixel is worth right now. CRS.Simple doubles
// per zoom level, so this is what an icon has to be scaled by to sit on the art
// it is marking.
function mapScale() {
  return leafletMap && leafletMap.getZoom ? Math.pow(2, leafletMap.getZoom()) : 1;
}

// Icon height for a point: the sprite's own height at the current zoom, so it
// lands exactly on the thing — floored by the layer's slider so a 7px sparkle
// does not vanish when the map is zoomed out. Marker icons are sized in screen
// pixels and do not scale themselves, which is why this has to be recomputed
// whenever the zoom changes.
function artHeight(cfg, art) {
  if (!art) return cfg.size;
  return Math.max(cfg.size, Math.round(art.h * mapScale()));
}

function renderMarkers() {
  clearMelons();
  const f = markerFrame();
  if (!f) return;
  const shown = {};

  const melonCfg = layerCfg('melon');
  const melonSrc = currentMode === 'world' && worldState ? worldState.melons
                                                         : ((highlights || {}).watermelons || []);
  if (melonCfg.on) {
    for (const m of melonSrc) {
      if (!f.has(m.mapId)) continue;
      // On the melon, not on its tile — same rule as every other marker.
      const mart = melonArt && melonArt[`${m.mapId}:${m.evId}`];
      const [lat, lng] = mart
        ? f.atPx(m.mapId, mart.x + mart.w / 2, mart.y + mart.h / 2)
        : f.at(m.mapId, m.x, m.y);
      melonLayers.push(melonMarker(lat, lng, m, melonCfg,
                                   artHeight(melonCfg, mart)).addTo(leafletMap));
      shown.melon = (shown.melon || 0) + 1;
      if (collected.has(pointKey({ layer: 'melon', mapId: m.mapId, evId: m.evId })))
        (shown.__done ||= {}).melon = ((shown.__done || {}).melon || 0) + 1;
    }
  }

  for (const p of ((collectibles || {}).points || [])) {
    const cfg = layerCfg(p.layer);
    if (!cfg || !cfg.on || !f.has(p.mapId)) continue;
    const [lat, lng] = f.at(p.mapId, p.x, p.y);
    const title = p.letter ? `${t('hangmanKey')} <b>${p.letter}</b>` : `<b>${p.evName}</b>`;
    const sep = LANG === 'zh' ? '、' : ', ';
    const what = p.items && p.items.length ? `<br>${p.items.map(itemName).join(sep)}` : '';
    const key = pointKey(p);
    const done = collected.has(key);
    let art = cfg.art === 'hangman' && p.letter ? `assets/hangman/${p.letter}.png` : null;
    let aspect = null;
    const dims = p.sprite && pointSprites && pointSprites[p.sprite];
    if (!art && dims) {
      art = `assets/points/${p.sprite.replace(/[^A-Za-z0-9_.-]/g, '_')}.png`;
      aspect = dims[0] / dims[1];
    }
    // Sit it on the sprite, not on the tile. The game anchors most frames by
    // the bottom of their drawn pixels, so a tall one — a sparkle, a lamp —
    // reaches above the tile its event lives on.
    const [alat, alng] = p.art
      ? f.atPx(p.mapId, p.art.x + p.art.w / 2, p.art.y + p.art.h / 2)
      : [lat, lng];
    const mk = pinMarker(alat, alng, cfg,
      `${title}<br>Map${p.mapId} @ (${p.x}, ${p.y})${what}${clueNote(p)}${requiresNote(p)}`,
      done ? 'done' : '', art, aspect, artHeight(cfg, p.art)).addTo(leafletMap);
    if (TICKABLE.has(p.layer)) mk.bindPopup(collectBubble(p, key, title, what));
    melonLayers.push(mk);
    shown[p.layer] = (shown[p.layer] || 0) + 1;
    if (done) (shown.__done ||= {})[p.layer] = ((shown.__done || {})[p.layer] || 0) + 1;
  }

  renderConveyorMarkers(f, shown);
  renderWorldRoutes(shown);
  updateMarkerCounts(shown);
  // A reversed belt run is a handful of arrows changing direction, easy to miss
  // on a big map. Say it in words too, so a click that worked never looks like
  // a click that did nothing.
  const note = document.getElementById('flipNote');
  if (note) {
    const n = flippedGroups.size;
    note.textContent = n ? `🔄 ${n} belt group${n > 1 ? 's' : ''} reversed` : '';
  }
}

// The routes you drew in the stitcher. Stitched view has drawn them all along;
// the world view never did, so the 158 routes in the all-regions layout were
// sitting in the file unread.
//
// A route is shown only when every map it snaps to is on screen. Half a route
// running off into a hidden region reads as a line to nowhere, and the point of
// hiding a region is that its connections go quiet with it.
function renderWorldRoutes(shown) {
  const cfg = layerCfg('route');
  if (currentMode !== 'world' || !cfg.on || !worldState) return;
  const { bbox, layout, visibleIds } = worldState;
  // The slider is line weight alone. It used to set the endpoint radius too,
  // and a thick route turned every snap point into a disc big enough to hide
  // the room it marks.
  const weight = cfg.size, dot = ROUTE_DOT_RADIUS;
  for (const r of (layout.routes || [])) {
    if (!r.pts || r.pts.length < 2) continue;
    if (!r.pts.every(p => !p.snap || visibleIds.has(String(p.snap.mapId)))) continue;
    const latlngs = r.pts.map(p => [bbox.ch - (p.y - bbox.minY), p.x - bbox.minX]);
    // How a route reads is the stitcher's call, not something to infer here.
    // Guessing one-way from the edge tables got most of them wrong; whoever
    // draws the route knows which way it goes, so `kind` rides along in the
    // layout and this draws what it says.
    const kind = r.kind || 'two';
    const shape = kind === 'loop' ? loopCurve(latlngs[0], latlngs[latlngs.length - 1]) : latlngs;
    melonLayers.push(L.polyline(shape, {
      color: r.color, weight, opacity: 0.95,
      dashArray: r.solid ? null : `${weight * 3},${weight * 2}`,
    }).addTo(leafletMap));
    for (const p of r.pts) {
      const mk = L.circleMarker([bbox.ch - (p.y - bbox.minY), p.x - bbox.minX], {
        radius: dot, color: '#fff', weight: 2, fillColor: r.color, fillOpacity: 1,
      }).addTo(leafletMap);
      if (p.snap) mk.bindPopup(`<b>${p.snap.evName || 'Snap'}</b><br>` +
                               `Map${p.snap.mapId} ev${p.snap.evId}`);
      melonLayers.push(mk);
    }
    // Direction is shown by a run of small chevrons along the whole line, not
    // one arrowhead at the end. A single head says "one-way" without saying
    // which end it starts from — you have to hunt for it, and on a short line
    // it hides under the snap dot. Chevrons answer everywhere at once.
    // Wrap-arounds get none: the curve already says which way it goes.
    if (kind === 'one') {
      melonLayers.push(L.polyline(chevrons(shape), {
        color: r.color, weight: Math.max(2, weight * 0.9), opacity: 1,
      }).addTo(leafletMap));
    }
    shown.route = (shown.route || 0) + 1;
  }
}

// A wrap-around — walk off one edge, come back in at the other. Drawn as one
// long flat loop rather than a straight line, because a straight line reads as
// "there is a path through here" when the whole point is that there isn't.
//
// Cubic Bezier whose handles run *outward* from each end, away from the other,
// so the curve leaves and arrives almost parallel to the line joining them and
// then bows to one side. REACH is how far the handles run and BOW how far it
// bulges, both as a fraction of end-to-end distance; at 1.20/0.12 the curve
// leaves within 6 degrees of parallel and is about twice the straight length.
const LOOP_REACH = 1.20, LOOP_BOW = 0.12, LOOP_STEPS = 48;
function loopCurve(p0, p3) {
  const dy = p3[0] - p0[0], dx = p3[1] - p0[1];
  const span = Math.hypot(dy, dx) || 1;
  const u = [dy / span, dx / span], perp = [-u[1], u[0]];
  const reach = span * LOOP_REACH, bow = span * LOOP_BOW;
  const c1 = [p0[0] - u[0] * reach + perp[0] * bow, p0[1] - u[1] * reach + perp[1] * bow];
  const c2 = [p3[0] + u[0] * reach + perp[0] * bow, p3[1] + u[1] * reach + perp[1] * bow];
  const out = [];
  for (let i = 0; i <= LOOP_STEPS; i++) {
    const t = i / LOOP_STEPS, v = 1 - t;
    out.push([v*v*v*p0[0] + 3*v*v*t*c1[0] + 3*v*t*t*c2[0] + t*t*t*p3[0],
              v*v*v*p0[1] + 3*v*v*t*c1[1] + 3*v*t*t*c2[1] + t*t*t*p3[1]]);
  }
  return out;
}

// Chevrons spaced along a polyline, returned as a multi-segment polyline so
// Leaflet draws them all as one layer. Same shape and spacing the stitcher
// uses, so a route looks the same in both.
const CHEVRON_GAP = 26, CHEVRON_LEN = 7, CHEVRON_SPREAD = 5;
function chevrons(pts) {
  const out = [];
  let carry = CHEVRON_GAP / 2;
  for (let i = 1; i < pts.length; i++) {
    const [y0, x0] = pts[i - 1], [y1, x1] = pts[i];
    const dy = y1 - y0, dx = x1 - x0;
    const len = Math.hypot(dy, dx);
    if (!len) continue;
    const uy = dy / len, ux = dx / len;
    for (let d = carry; d < len; d += CHEVRON_GAP) {
      const cy = y0 + uy * d, cx = x0 + ux * d;
      const by = cy - uy * CHEVRON_LEN, bx = cx - ux * CHEVRON_LEN;
      const py = -ux * CHEVRON_SPREAD, px = uy * CHEVRON_SPREAD;
      out.push([[by + py, bx + px], [cy, cx], [by - py, bx - px]]);
    }
    carry = ((carry - len) % CHEVRON_GAP + CHEVRON_GAP) % CHEVRON_GAP;
  }
  return out;
}

// Each machine drives its own run of belts, so each gets its own button. The
// overlay holds only that group's belts in their reversed state and sits in the
// map's own pane, which keeps the world view's dimming and gradients applying
// to it exactly as they apply to the map underneath.
function renderConveyorMarkers(f, shown) {
  if (!conveyors) return;
  const cfg = layerCfg('machine');
  for (const [mapId, data] of Object.entries(conveyors)) {
    if (!f.has(mapId)) continue;
    for (const g of data.groups) {
      const key = `${mapId}:${g.evRange[0]}`;
      const flipped = flippedGroups.has(key);
      if (flipped) {
        const o = g.overlay;
        const url = `../data/conveyors/${o.file}${CACHE_BUST}`;
        // Only name a pane when there is one. Leaflet copies whatever options
        // object it is given over its defaults, so passing `pane: undefined`
        // does not fall back to 'overlayPane' — it replaces it with undefined,
        // getPane() returns nothing and appendChild throws. That threw inside
        // renderMarkers, which is why clicking a machine in Per-Map view did
        // nothing at all: no overlay, and no marker rebuilt behind it either.
        const pane = f.pane(mapId);
        const layer = L.imageOverlay(url, f.rect(mapId, o.x, o.y, o.w, o.h),
                                     pane ? { pane } : {}).addTo(leafletMap);
        // Say so loudly if the reversed-belt image cannot be fetched, rather
        // than leaving a click that silently appears to do nothing.
        layer.on('error', () => console.error(`conveyor overlay failed to load: ${url}`));
        melonLayers.push(layer);
      }
      if (!cfg.on) continue;
      for (const m of g.machines) {
        // Sit the marker on the machine, wearing the machine's own frame. The
        // pink one and the blue one are different frames, and the frame is
        // anchored by its top-left rather than centred on its tile, so a pin
        // placed at the tile centre sat up and to the left of what it labels.
        const art = m.art;
        const [lat, lng] = art
          ? f.atPx(mapId, art.x + art.w / 2, art.y + art.h / 2)
          : f.at(mapId, m.x, m.y);
        const src = art && pointSprites && pointSprites[art.sprite]
          ? `assets/points/${art.sprite.replace(/[^A-Za-z0-9_.-]/g, '_')}.png` : cfg.art;
        const mk = pinMarker(lat, lng, cfg,
          `<b>${m.name}</b><br>drives ${g.belts.length} belt(s)<br>` +
          `<i>click to reverse them</i>`, 'machine' + (flipped ? ' flipped' : ''),
          src, art ? art.w / art.h : null, artHeight(cfg, art));
        mk.on('click', () => {
          if (flippedGroups.has(key)) flippedGroups.delete(key); else flippedGroups.add(key);
          console.log(`belt machine ${m.name} (map${mapId}) -> ` +
                      `${flippedGroups.has(key) ? 'reversed' : 'default'}; ` +
                      `${g.belts.length} belt(s)`);
          // Redrawing from inside the click handler tears down the marker that
          // is still dispatching it, and Leaflet finishes the dispatch against
          // a marker whose icon is already gone — the throw lands mid-teardown,
          // so the old pins are removed and the new ones never get added. One
          // tick later the dispatch is over and the swap is safe.
          setTimeout(renderMarkers, 0);
        });
        melonLayers.push(mk.addTo(leafletMap));
        shown.machine = (shown.machine || 0) + 1;
      }
    }
  }
}

const groupLabel = g => (g === 'achievement' ? t('achievements') : g);

function renderMarkerPanel() {
  const rows = document.getElementById('markerRows');
  rows.innerHTML = '';
  let openGroup = null;
  for (const cfg of MARKER_LAYERS) {
    // A layer tied to a route is only offered while that route is being played;
    // it also goes off, so it cannot stay on the map after the route changes.
    if (cfg.route && cfg.route !== routeMode) { cfg.on = false; continue; }
    if (cfg.group !== openGroup) {
      openGroup = cfg.group;
      if (openGroup) {
        // Bind the name here. `openGroup` is reassigned as the loop walks the
        // rest of the layers, so a handler closing over the variable would act
        // on whatever group happened to be last — which is none of them.
        const group = openGroup;
        const head = document.createElement('div');
        head.className = 'group-head';
        head.innerHTML = `<label><input type="checkbox">${groupLabel(group)}</label>`;
        const box = head.querySelector('input');
        const members = () => MARKER_LAYERS.filter(l => l.group === group &&
                                                       (!l.route || l.route === routeMode));
        box.checked = members().every(l => l.on);
        box.addEventListener('change', e => {
          for (const l of members()) l.on = e.target.checked;
          renderMarkerPanel();
          renderMarkers();
        });
        rows.appendChild(head);
      }
    }
    const row = document.createElement('div');
    row.className = 'row' + (cfg.on ? '' : ' off');
    const range = cfg.key === 'route' ? 'min="1" max="10"' : 'min="10" max="48"';
    row.innerHTML =
      `<label><input type="checkbox" ${cfg.on ? 'checked' : ''}>${cfg.icon} ${layerLabel(cfg)}</label>` +
      `<input type="range" ${range} value="${cfg.size}">` +
      (cfg.blink === undefined ? ''
        : `<button class="blinkBtn${cfg.blink ? ' on' : ''}" title="${t('pulse')}">✦</button>`) +
      `<span class="count" data-count="${cfg.key}"></span>`;
    row.querySelector('input[type=checkbox]').addEventListener('change', e => {
      cfg.on = e.target.checked;
      row.classList.toggle('off', !cfg.on);
      renderMarkers();
    });
    row.querySelector('input[type=range]').addEventListener('input', e => {
      cfg.size = +e.target.value;
      renderMarkers();
    });
    const blinkBtn = row.querySelector('.blinkBtn');
    if (blinkBtn) blinkBtn.addEventListener('click', () => {
      cfg.blink = !cfg.blink;
      blinkBtn.classList.toggle('on', cfg.blink);
      renderMarkers();
    });
    rows.appendChild(row);
  }
}

function updateMarkerCounts(shown) {
  const done = (shown || {}).__done || {};
  for (const cfg of MARKER_LAYERS) {
    const el = document.querySelector(`[data-count="${cfg.key}"]`);
    if (!el) continue;
    const n = (shown || {})[cfg.key] || 0;
    // Tickable layers read as progress; the rest are just a count.
    el.textContent = !cfg.on ? '' : (TICKABLE.has(cfg.key) ? `${done[cfg.key] || 0}/${n}` : n);
  }
  const btn = document.getElementById('clearCollected');
  if (btn) {
    btn.style.display = collected.size ? '' : 'none';
    btn.textContent = `clear ${collected.size} ✓`;
  }
}


// ─────────────────────────── Per-Map view ───────────────────────────
function loadMap(mapId) {
  const meta = mapMeta[mapId];
  if (!meta) return;
  // Markers key off this rather than the dropdown, which has not necessarily
  // caught up when loadMap is called directly.
  currentMapId = String(mapId);
  document.getElementById('mapInfo').textContent =
    `${meta.width}×${meta.height} ${t('tiles')} · ${t('bgm')}${meta.bgm || t('none')}`;
  clearLayers();

  const imgUrl = mapImageUrl(mapId, meta);
  const w = meta.width * TILE_PX;
  const h = meta.height * TILE_PX;
  const bounds = [[0, 0], [h, w]];
  const layer = L.imageOverlay(imgUrl, bounds).addTo(leafletMap);
  currentLayers.push(layer);
  leafletMap.fitBounds(bounds);

  const exits = (edges.internal || []).filter(e => String(e.from.mapId) === String(mapId));
  for (const e of exits) {
    const fy = e.from.y * TILE_PX + TILE_PX / 2;
    const fx = e.from.x * TILE_PX + TILE_PX / 2;
    const lat = h - fy, lng = fx;
    const dst = mapMeta[e.to.mapId];
    const dstName = dst ? dst.name : `Map${e.to.mapId}`;
    const marker = L.circleMarker([lat, lng], {
      radius: 6, color: '#fff', weight: 1.5,
      fillColor: '#ff4080', fillOpacity: 0.85,
    }).addTo(leafletMap);
    marker.bindPopup(
      `<b>${e.from.evName}</b><br>(${e.from.x},${e.from.y}) → Map${e.to.mapId}<br>` +
      `<i>${dstName}</i> @(${e.to.x},${e.to.y})<br>` +
      `<a href="#" data-mid="${e.to.mapId}" class="goto">→ go</a>`);
    currentLayers.push(marker);
  }
  setTimeout(() => {
    document.querySelectorAll('.leaflet-popup .goto').forEach(a => {
      a.addEventListener('click', ev => {
        ev.preventDefault();
        const mid = ev.target.dataset.mid;
        document.getElementById('mapSelect').value = mid;
        loadMap(mid);
      });
    });
  }, 50);
  renderMarkers();
}

// ─────────────────────────── Stitched view ───────────────────────────
let stitchedState = null;  // { layout, routes, bbox } — needed for live slider redraw

async function loadStitched(region, variant) {
  clearLayers();
  const suffix = variant ? `_${variant}` : '';
  const layoutPath = `../data/stitched/${region}_layout${suffix}.json`;
  const pngPath    = `../data/stitched/stitched_${region}${suffix}.png${CACHE_BUST}`;
  let layout;
  try {
    layout = await (await fetchData(layoutPath)).json();
  } catch (err) {
    document.getElementById('mapInfo').textContent = `No stitched layout for ${region}${suffix ? '/' + variant : ''}`;
    return;
  }

  // Compute bbox same as stitcher's exportPNG (line 906-918 of stitcher_junkyard.html)
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const id of Object.keys(layout.layout)) {
    const pos = layout.layout[id];
    const m = mapMeta[id];
    if (!m) continue;
    const cr = cropRect(pos.crop || 'full', m);
    const w = m.width * TILE_PX;
    const cropH = cr.h * TILE_PX;
    minX = Math.min(minX, pos.x);
    minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + w);
    maxY = Math.max(maxY, pos.y + cropH);
  }
  const cw = maxX - minX, ch = maxY - minY;
  document.getElementById('mapInfo').textContent =
    `${Object.keys(layout.layout).length} ${t('maps')} · ` +
    `${layout.routes?.length || 0} ${t('routes')} · ${cw}×${ch}px`;

  const bounds = [[0, 0], [ch, cw]];
  const layer = L.imageOverlay(pngPath, bounds).addTo(leafletMap);
  currentLayers.push(layer);
  leafletMap.fitBounds(bounds);

  stitchedState = { layout, bbox: { minX, minY, cw, ch } };
  renderRoutesOverlay();
  renderMarkers();
}

function renderRoutesOverlay() {
  if (!stitchedState) return;
  // Remove previous overlay layers (keep image overlay = first one)
  for (let i = currentLayers.length - 1; i >= 1; i--) {
    leafletMap.removeLayer(currentLayers[i]);
    currentLayers.splice(i, 1);
  }
  const { layout, bbox } = stitchedState;
  for (const r of (layout.routes || [])) {
    if (!r.pts || r.pts.length < 2) continue;
    // Convert world coords → PNG pixel coords → leaflet latLng (lat = ch - y)
    const latlngs = r.pts.map(p => [bbox.ch - (p.y - bbox.minY), p.x - bbox.minX]);
    const line = L.polyline(latlngs, {
      color: r.color, weight: lineWidth, opacity: 0.95,
      dashArray: `${lineWidth * 3},${lineWidth * 2}`,
    }).addTo(leafletMap);
    currentLayers.push(line);
    for (const p of r.pts) {
      const lat = bbox.ch - (p.y - bbox.minY);
      const lng = p.x - bbox.minX;
      const dot = L.circleMarker([lat, lng], {
        radius: dotSize, color: '#fff', weight: 2,
        fillColor: r.color, fillOpacity: 1,
      }).addTo(leafletMap);
      const sn = p.snap;
      if (sn) dot.bindPopup(`<b>${sn.evName || 'Snap'}</b><br>Map${sn.mapId} ev${sn.evId}`);
      currentLayers.push(dot);
    }
  }
}

// ─────────────────────────── World view ───────────────────────────
// Every region on one canvas, each in its own Leaflet pane so it can be
// greyed, hidden or lifted as a unit. Regions overlap on purpose here, which
// is exactly why a flat stitch doesn't work: whichever map was drawn last
// wins and there is no way to read one region out of the pile.

// Order matters: the first region to claim a map keeps it. Snowglobe Mountain
// comes before Otherworld because Map132 is listed by both — Otherworld holds
// the uncut igloo, Snowglobe Mountain the four rooms cut out of it, and it is
// the rooms that are actually drawn. Deeper Well comes before Inside Humphrey
// for the same reason: ALCOVES II (437) is a reward room both open onto, Deeper
// Well keeps it, and that is why Humphrey shows 16 of its 31 watermelons here.
const ALL_REGIONS = ['faraway', 'vast_forest', 'orange_oasis', 'snowglobe_mountain',
  'otherworld', 'junkyard', 'pyrefly_forest', 'sweethearts_castle', 'deep_well',
  'deeper_well', 'humphrey', 'last_resort', 'white_space', 'forest_playground'];
// The Chinese column is the game's own, lifted out of languages/sc by matching
// the key each line shares with languages/en — 辽阔森林 rather than a literal
// "广袤森林", 最后度假村 rather than "最后的度假胜地", and 汉弗莱 (the enemy
// entry in the Chinese build) rather than the 亨弗莱 you would guess.
const REGION_NAMES = {
  faraway:            { en: 'Faraway Town',       zh: '遥远镇' },
  vast_forest:        { en: 'Vast Forest',        zh: '辽阔森林' },
  orange_oasis:       { en: 'Orange Oasis',       zh: '橙子绿洲' },
  otherworld:         { en: 'Otherworld',         zh: '异世界' },
  junkyard:           { en: 'Junkyard',           zh: '垃圾场' },
  pyrefly_forest:     { en: 'Pyrefly Forest',     zh: '焚火虫森林' },
  sweethearts_castle: { en: 'Sweethearts Castle', zh: '甜心城堡' },
  deep_well:          { en: 'Deep Well',          zh: '深井' },
  deeper_well:        { en: 'Deeper Well',        zh: '深井深处' },
  last_resort:        { en: 'Last Resort',        zh: '最后度假村' },
  forest_playground:  { en: 'Forest Playground',  zh: '森林游乐场' },
  snowglobe_mountain: { en: 'Snowglobe Mountain', zh: '雪花球山' },
  white_space:        { en: 'White Space',        zh: '白色空间' },
  humphrey:           { en: 'Inside Humphrey',    zh: '汉弗莱体内' },
};
const regionLabel = r => (REGION_NAMES[r] || {})[LANG] || (REGION_NAMES[r] || {}).en || r;

// The legend used to sort by how many maps a region holds, which put DEEPER
// WELL at the top and buried the two places you actually navigate from. This is
// the order you meet them in: WHITE SPACE, the hub you always come back to,
// then VAST FOREST, which every route leaves from, then the routes themselves,
// with FARAWAY last because it is the waking world and shares no ground with
// any of them. A region missing from here falls to the bottom, alphabetically.
const REGION_ORDER = ['white_space', 'vast_forest', 'forest_playground', 'otherworld',
  'junkyard', 'pyrefly_forest', 'sweethearts_castle', 'orange_oasis',
  'snowglobe_mountain', 'deep_well', 'deeper_well', 'humphrey', 'last_resort', 'faraway'];
const regionRank = r => {
  const i = REGION_ORDER.indexOf(r);
  return i === -1 ? REGION_ORDER.length : i;
};
// Swatches only label the legend — the maps keep their own art.
const REGION_COLORS = {
  faraway: '#ff9db0', vast_forest: '#7fd18a', orange_oasis: '#ffb45e',
  otherworld: '#8fb7ff', junkyard: '#c9a26d', pyrefly_forest: '#b98cff',
  sweethearts_castle: '#ff8ad0', deep_well: '#5fd5d5', deeper_well: '#4f8ae0',
  last_resort: '#e0605f', forest_playground: '#9fe07f',
  snowglobe_mountain: '#cfe6ff', white_space: '#dddddd', humphrey: '#7f6bd8',
};

// Edge fades, entirely by hand. There used to be an automatic pass that pulled
// in whatever maps a region's doors opened onto and dissolved them radially,
// but it could find *which* maps, never which way they should fade, so it fell
// back to a fade from the centre outward. On DEEP WELL that dragged in LAST
// RESORT and left it as a black smear: dark art, mostly masked away, over a
// near-black page. A region now shows the maps it owns, plus exactly the
// neighbours named here.
//
// A map listed here need not belong to another region: NORTH COAST is Vast
// Forest's own, faded upward so the sea reads as continuing past it.
const EDGE_FADE = {
  vast_forest: {
    '152': 'left',       // PYREFLY FOREST — solid at its right, transparent at its left
    '117': 'right',      // OTHERWORLD LADDER — solid left, transparent right
    '90':  'top|deep_well',
                         // NORTH COAST — trails off into the foggy sea until
                         // Deep Well, whose NORTH LAKE butts straight onto it,
                         // is shown as well
    '105': 'top|orange_oasis',
                         // TRAIN STATION WAITING AREA — the train line trails off
                         // northward until Orange Oasis, where it goes, is shown too
  },
};

// A map's region in the extractor is where it sits in the game's map tree, and
// that is not always where it belongs on a world view. The train line's forest
// half — the waiting area and the train itself — is filed under Vast Forest
// because the station stands in the forest, but it exists to reach Orange
// Oasis, whose own half of the line (TRAIN STATION, TRAIN INTERIOR) is already
// there. Leaving it in Vast Forest also made it collide with PYREFLY I
// whenever both were shown, for 627 of the 687 tiles those two overlap in.
const REGION_OVERRIDE = {
  '327': 'orange_oasis',   // TRAIN STATION TRAIN — the ride belongs to where it goes
};

// A fade is written as a side, optionally with the point it finishes at:
// 'top' — the side that goes transparent. On its own it takes the shared
//   pixel geometry below, which is what every edge should normally use.
// 'top:30' — the first 30% of the map stays fully opaque before the fade
//   starts, as a percentage of the map's own length along that axis.
// 'top:30@50' — and it is fully transparent halfway across rather than at the
//   far edge. Finishing early is what clears an overlap outright: Map105 covers
//   PYREFLY I across its top 39%, so being gone by 50% removes the clash.
// 'top|orange_oasis' — and it only fades while that region is hidden.
//
// Percentages are the override, not the default, because the same percentage
// is a different distance on every map: 30% is 518px down Map105 and 1254px
// across PYREFLY FOREST, so one edge read as a defined soft border and the
// other as a haze over half the map. Reach for one only when an edge has to
// clear a particular overlap rather than merely look right.
//
// A fade says "the map carries on past here, but you aren't showing it". Once
// the region on the other side is displayed, the continuation is really there,
// so the fade has to go: showing Orange Oasis should make the train line solid
// all the way through, not leave Vast Forest's half of it ghosted.
//
// With no region named, a borrowed map faces the region that owns it, and a
// map the selected region owns faces nothing and always fades — NORTH COAST
// dissolves into open sea, which is scenery rather than a region to reveal.
function parseFade(spec) {
  const [head, facing] = String(spec).split('|');
  const [range, end] = head.split('@');
  const [side, solid] = range.split(':');
  return {
    side,
    solid: solid === undefined ? null : +solid,
    end: end ? +end : 100,
    facing: facing || null,
  };
}

// Both distances are measured inward from the fading edge, in the map's own
// pixels, so every faded edge looks the same however long the map behind it
// is. The figures are Map105's: the train line's fade had to be cut short so
// it would stop covering PYREFLY I, and it is the one that already looked
// right.
//
// They are turned into percentages here, against the map's size in tiles.
// Writing them straight into the gradient as `calc(100% - 864px)` does not
// work and fails silently: the mask applies to the Leaflet overlay element,
// whose 100% is the map *as currently scaled on screen*, not its 1728px of
// artwork. Zoomed out to a few hundred pixels the subtraction goes negative
// and the whole map turns transparent — which is exactly what happened.
const FADE_CLEAR_PX = 864;   // 27 tiles: gone entirely at the fading edge
const FADE_BAND_PX  = 352;   // 11 tiles: the gradient, before the map is solid

function fadeMask(spec, meta) {
  const { side, solid, end } = parseFade(spec);
  // A hand-written percentage still wins — see the note on parseFade above.
  if (solid !== null || end !== 100) {
    return `linear-gradient(to ${side}, #000 ${solid === null ? 0 : solid}%, transparent ${end}%)`;
  }
  // The gradient runs from the far edge (0%) to the fading edge (100%), so
  // both distances count backwards from 100.
  const axis = (side === 'left' || side === 'right' ? meta.width : meta.height) * TILE_PX;
  const clamp = v => Math.max(0, Math.min(100, v));
  const clearPct = clamp(100 - (FADE_CLEAR_PX / axis) * 100);
  const solidPct = clamp(100 - ((FADE_CLEAR_PX + FADE_BAND_PX) / axis) * 100);
  return `linear-gradient(to ${side}, #000 ${solidPct.toFixed(2)}%, transparent ${clearPct.toFixed(2)}%)`;
}

// Scenery saved out of the ALL stitcher — trees that fill the gaps the maps
// leave between them. They share the maps' z scale, so one can be tucked
// behind a map as easily as laid over it. Sizes are the source PNGs' own and
// must match DECORATIONS in stitcher_all.html: a wrong size here would stretch
// every scaled copy.
const DECO_ART = {
  tree_part:  { src: 'assets/decorations/tree_part.png',  w: 61, h: 65 },
  tree_full:  { src: 'assets/decorations/tree_full.png',  w: 61, h: 60 },
  pinwheel:   { src: 'assets/decorations/pinwheel.png',   w: 59, h: 59 },
  pinwheel_2: { src: 'assets/decorations/pinwheel_2.png', w: 68, h: 69 },
  pinwheel_3: { src: 'assets/decorations/pinwheel_3.png', w: 57, h: 56 },
};

// A decoration carries no region of its own — it is scenery dropped on the
// world plane. Give it the region of the map it stands nearest, so it comes
// and goes with the ground it was placed to dress. Nearest rather than
// underneath: most of them fill the void *between* maps and stand on none.
function nearestMapTo(cx, cy, placed) {
  let best = null, bestD = Infinity;
  for (const it of placed) {
    const dx = Math.max(it.pos.x - cx, 0, cx - (it.pos.x + it.w));
    const dy = Math.max(it.pos.y - cy, 0, cy - (it.pos.y + it.h));
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}

// Leaflet positions an image overlay with a CSS transform, so a flipped
// decoration cannot just carry a scaleX(-1) of its own — the two would fight
// over the same property and the tree would land somewhere else entirely.
// Mirror the art itself instead, once per kind.
const flippedArt = {};
function flippedSrc(art) {
  if (!flippedArt[art.src]) {
    flippedArt[art.src] = new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.translate(img.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0);
        res(c.toDataURL());
      };
      // Better a tree facing the wrong way than no tree and a hole.
      img.onerror = () => { console.warn(`decoration art failed: ${art.src}`); res(art.src); };
      img.src = art.src + CACHE_BUST;
    });
  }
  return flippedArt[art.src];
}


// One overlay per sprite is still what happens when the manifest does not
// match the layout, and ?deco=plain forces it — the only way to see what the
// bake is for without deleting the manifest.
const DECO_MODE = new URLSearchParams(location.search).get('deco') || 'baked';

// ── Baked decoration clusters ───────────────────────────────────────────────
// The trees bridge holes in the layout, so what sits behind them is #map's own
// background. Leaflet sizes and positions each overlay separately in fractional
// CSS pixels, they round separately, and at any zoom short of 1:1 hairline
// cracks open between neighbouring sprites and let that background through —
// which reads as a black outline around every tree. stitcher_all.html never
// shows it because it scales one container instead of 179 images.
//
// One image cannot crack against itself, so scripts/36_bake_deco_clusters.py
// composites each contiguous run into a single PNG and this swaps them in.
// See the .world-deco comment for how to re-check the diagnosis.
//
// The manifest is only trusted if it still describes the layout in hand: every
// uid has to name a decoration that is still where it was baked, and the
// clusters together have to account for all of them. A stale manifest — the
// layout re-exported without re-running 36 — falls back to one overlay per
// sprite, which is the old picture, cracks and all, rather than a wrong one.
async function bakedDecos(decos) {
  let manifest;
  try {
    manifest = await fetchData('../data/stitched/deco_clusters.json').then(r => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  } catch (e) {
    return null;                       // never baked, or the file is gone
  }
  const byUid = new Map();
  for (const it of decos) {
    if (it.deco.uid === undefined) return null;
    byUid.set(it.deco.uid, it);
  }
  const seen = new Set();
  const out = [];
  for (const c of (manifest.clusters || [])) {
    let region = null;
    for (const uid of c.uids) {
      const it = byUid.get(uid);
      if (!it) return stale(`uid ${uid} is not in the layout`);
      if (seen.has(uid)) return stale(`uid ${uid} is in two clusters`);
      if (region === null) region = it.region;
      else if (it.region !== region) return stale(`cluster ${c.file} spans two regions`);
      // A sprite that moved keeps its uid, so check the geometry too.
      if (it.pos.x < c.x || it.pos.y < c.y ||
          it.pos.x + it.w > c.x + c.w || it.pos.y + it.h > c.y + c.h) {
        return stale(`uid ${uid} has moved outside ${c.file}`);
      }
      seen.add(uid);
    }
    if (!c.uids.length) continue;
    out.push({ deco: c, w: c.w, h: c.h, region,
               pos: { x: c.x, y: c.y, zOrder: c.zOrder },
               url: c.file + CACHE_BUST });
  }
  if (seen.size !== decos.length) {
    return stale(`covers ${seen.size} of ${decos.length} decorations`);
  }
  console.log(`Decorations: ${decos.length} sprites drawn as ${out.length} baked image(s).`);
  return out;
}
function stale(why) {
  console.warn(`deco_clusters.json is out of date (${why}) — drawing decorations ` +
               `one by one. Re-run scripts/36_bake_deco_clusters.py.`);
  return null;
}

let worldState = null;      // { bbox, byRegion, panes, placed, visibleIds }
const DEFAULT_WORLD_REGION = 'vast_forest';
const selectedRegions = new Set([DEFAULT_WORLD_REGION]);

async function loadWorld() {
  clearLayers();
  if (worldState) {
    // Coming back from another mode: clearLayers() pulled the overlays off the
    // map but the panes and geometry are still good, so just put them back.
    // Re-add in the order they were first laid down, not region by region:
    // stacking inside a pane is DOM order, so putting every map back before
    // every decoration would float the trees above the maps they were placed
    // behind.
    for (const it of worldState.drawOrder) {
      if (!it.layer) continue;
      it.layer.addTo(leafletMap);
      currentLayers.push(it.layer);
    }
    applySelection();
    return;
  }

  let layout;
  try {
    layout = await (await fetchData('../data/stitched/all_regions_layout.json')).json();
  } catch (err) {
    document.getElementById('mapInfo').textContent =
      'No all_regions_layout.json — save one from the ALL stitcher into data/stitched/.';
    return;
  }

  // Region metadata for every map at once; also remember which region each
  // map came from, since a map can be listed under more than one.
  const metaAll = {}, regionOf = {}, melons = [];
  await Promise.all(ALL_REGIONS.map(async r => {
    const [m, h] = await Promise.all([
      fetchData(`../data/${r}_maps.json`).then(x => x.json()),
      fetchData(`../data/${r}_highlights.json`).then(x => x.json()).catch(() => ({})),
    ]);
    // First region to claim a map keeps it. FOREST PLAYGROUND is its own
    // single-map region in the extractor *and* sits in Vast Forest's extraMaps;
    // last-wins handed Map92 to the one-map region, so Vast Forest lost the
    // playground and a region appeared holding nothing but a map it borrowed.
    for (const [id, v] of Object.entries(m)) {
      metaAll[id] = v;
      if (!(id in regionOf)) regionOf[id] = REGION_OVERRIDE[id] || r;
    }
    for (const w of (h.watermelons || [])) melons.push({ ...w, region: r });
  }));

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const placed = [];
  for (const [id, pos] of Object.entries(layout.layout || {})) {
    const m = metaAll[id];
    if (!m) continue;
    const cr = cropRect(pos.crop || 'full', m);
    const w = m.width * TILE_PX, h = cr.h * TILE_PX;
    placed.push({ id, pos, m, cr, w, h, region: regionOf[id] || '' });
    minX = Math.min(minX, pos.x); minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + w); maxY = Math.max(maxY, pos.y + h);
  }
  if (!placed.length) {
    document.getElementById('mapInfo').textContent = 'Layout has no maps this build knows about.';
    return;
  }
  const bbox = { minX, minY, cw: maxX - minX, ch: maxY - minY };

  // One pane per region. Panes stack by zIndex, so focusing is just a bump.
  const panes = {}, byRegion = {};
  for (const r of ALL_REGIONS) {
    const p = leafletMap.createPane('region-' + r);
    p.classList.add('region-pane');
    p.style.zIndex = 300;
    panes[r] = p;
    byRegion[r] = [];
  }
  // Decorations go through the same sort as the maps, for the same reason the
  // stitcher interleaves them: a tree the layout put *behind* a map would
  // otherwise be appended after every map and could only ever sit on top.
  const decos = [], unknownKinds = new Set();
  for (const d of (layout.decorations || [])) {
    const art = DECO_ART[d.kind];
    if (!art) { unknownKinds.add(d.kind); continue; }
    const w = art.w * (d.scale ?? 1), h = art.h * (d.scale ?? 1);
    const near = nearestMapTo(d.x + w / 2, d.y + h / 2, placed);
    if (!near) continue;
    decos.push({ deco: d, art, w, h, region: near.region, nearId: String(near.id),
                 pos: { x: d.x, y: d.y, zOrder: d.zOrder ?? 0 },
                 url: d.flip ? await flippedSrc(art) : art.src + CACHE_BUST });
  }
  if (unknownKinds.size) {
    console.warn(`loadWorld: layout has decoration kind(s) this build has no art ` +
                 `for — ${[...unknownKinds].join(', ')}. Add them to DECO_ART.`);
  }
  const drawnDecos = DECO_MODE === 'baked'
    ? (await bakedDecos(decos) || decos)
    : decos;
  if (DECO_MODE !== 'baked') {
    console.log(`Decorations: ?deco=${DECO_MODE} — ${decos.length} sprites, `
                + `one overlay each.`);
  }

  // Draw in the stitcher's z-order, not map-id order. Leaflet stacks overlays
  // in the order they are added within a pane, and object keys that look like
  // integers iterate numerically — so without this the maps land in id order
  // and a neighbour's black filler paints over the map that should be on top
  // (PINWHEEL FOREST EAST under TRAIN STATION TRAIN, LOST LIBRARY 3 over 2, …).
  // Cross-region stacking stays a pane concern; applySelection bumps the
  // focused region's pane above the rest.
  const drawOrder = [...placed, ...drawnDecos].sort(
    (a, b) => (a.pos.zOrder ?? 0) - (b.pos.zOrder ?? 0));
  for (const it of drawOrder) {
    if (!panes[it.region]) continue;
    const lat = bbox.ch - (it.pos.y - bbox.minY);
    const lng = it.pos.x - bbox.minX;
    const layer = L.imageOverlay(it.deco ? it.url : mapImageUrl(it.id, it.m),
                                 [[lat - it.h, lng], [lat, lng + it.w]],
                                 { pane: 'region-' + it.region,
                                   className: it.deco ? 'world-deco' : '' });
    layer.addTo(leafletMap);
    currentLayers.push(layer);
    it.layer = layer;
    // byRegion drives the region legend's counts, so only maps go in it — a
    // region has no business being reported as holding 91 more maps than it has.
    if (!it.deco) byRegion[it.region].push(it);
  }

  worldState = { bbox, byRegion, panes, layout, melons, regionOf, metaAll, placed,
                 decos, drawnDecos, drawOrder, visibleIds: new Set() };
  leafletMap.fitBounds([[0, 0], [bbox.ch, bbox.cw]]);
  document.getElementById('mapInfo').textContent =
    `${placed.length} ${t('maps')} · ${bbox.cw}×${bbox.ch}px · ` +
    `${Object.values(byRegion).filter(v => v.length).length} ${t('regionsWord')}` +
    (decos.length ? ` · ${decos.length} ${t('scenery')}` : '');

  // Element styling needs the <img> nodes to exist, which happens a tick after
  // the overlays are added.
  setTimeout(applySelection, 0);
}

// Everything under data/ is regenerated by the pipeline and re-exported from
// the stitcher, often several times an hour, and `python3 -m http.server` sends
// no Cache-Control at all — so the browser falls back to heuristic caching and
// can sit on a layout for hours without ever asking whether it changed. That is
// exactly what happened to a freshly saved all_regions_layout.json: the file on
// disk had the trees and the corrected z-order, the page kept drawing the copy
// it had cached that morning, and no amount of ordinary reloading shifted it.
// `no-cache` still uses the cache — it just always revalidates first, so an
// unchanged file costs one 304 and nothing more.
function fetchData(url, opts) {
  return fetch(url, { cache: 'no-cache', ...(opts || {}) });
}

// Add ?fresh to the page URL to force every map image to reload. The PNGs get
// rewritten often, and the browser holds on to them: the file on disk can be
// right, the one served can be right, and the page still shows last week's.
// Hard refresh does not reliably reach images Leaflet puts in an <img>.
const CACHE_BUST = /(^|[?&])fresh(=|&|$)/.test(location.search) ? `?v=${Date.now()}` : '';

// Each render's own modification time, out of data/raw_pngs/manifest.json.
// Without it a rewritten PNG keeps being drawn from cache — SOLAR SYSTEM was
// re-rendered from black-and-white to the real thing and the page went on
// showing the old bytes. Stamping the URL means an unchanged file still comes
// from cache and a changed one cannot. `?fresh` still overrides the lot.
let pngVersion = {};
const stampPng = file => CACHE_BUST || (pngVersion[file] ? `?v=${pngVersion[file]}` : '');

function mapImageUrl(id, m) {
  const file = (m && m.image) || `map${id}.png`;
  return `../data/raw_pngs/${file}${stampPng(file)}`;
}

// Only one region is shown at a time. Everything overlaps in this layout, so
// drawing them all at once is unreadable no matter how they are tinted — the
// answer is to show one and let the ways out of it fade.
//
// A region's gateway maps — the maps its doors actually lead to — are drawn
// too, fading outward, so you can see where the region connects without the
// neighbour's whole sprawl arriving with it. Vast Forest's are OTHERWORLD
// LADDER, PYREFLY FOREST, NORTH LAKE and TRAIN STATION.
function applySelection() {
  if (!worldState) return;
  const { placed, panes } = worldState;

  // Work out, across every selected region, which maps are shown and which of
  // them fade. An explicit EDGE_FADE entry always fades, even for a map the
  // selected region owns — NORTH COAST dissolves into the sea, not into a
  // neighbour. A gateway borrowed from another region stops fading once that
  // region is selected too, since then it is being shown in its own right.
  const shown = new Set(), fadeSide = {}, selfFade = new Set();
  for (const r of selectedRegions) {
    const fades = EDGE_FADE[r];
    if (fades) {
      for (const [id, side] of Object.entries(fades)) {
        shown.add(id); fadeSide[id] = side;
        if (worldState.regionOf[id] === r) selfFade.add(id);
      }
    }
  }

  // A pin belongs to a map, not to the world, so it has no business outliving
  // the map it sits on. Recording what is actually on screen here means every
  // marker layer gets the region filtering for free.
  worldState.visibleIds = new Set();
  const fading = new Set();
  for (const it of placed) {
    const el = it.layer.getElement && it.layer.getElement();
    if (!el) continue;
    const id = String(it.id);
    const ownSelected = selectedRegions.has(it.region);
    const onScreen = (ownSelected || shown.has(id)) && !offRoute(id, it.region);
    el.style.display = onScreen ? '' : 'none';
    if (onScreen) worldState.visibleIds.add(id);
    const side = fadeSide[id];
    // Fade while the side it faces is still hidden. A named region wins; with
    // none, a borrowed map faces its owner and a self-owned one faces nothing.
    const facing = side ? (parseFade(side).facing || (selfFade.has(id) ? null : it.region)) : null;
    const fades = side && (facing === null ? true : !selectedRegions.has(facing));
    const meta = worldState.metaAll[id];
    if (fades && meta) {
      fading.add(id);
      el.style.webkitMaskImage = el.style.maskImage = fadeMask(side, meta);
      el.style.filter = '';
    } else {
      el.style.webkitMaskImage = el.style.maskImage = '';
      el.style.filter = '';
    }
  }

  // A tree is dressing for the ground beside one particular map: when that map
  // is off screen there is nothing left for it to dress. It goes when the map
  // it stands nearest goes, and also when that map is fading at a region edge —
  // a tree standing solid over an edge busy dissolving reads worse than the
  // gap it was hiding.
  for (const it of (worldState.decos || [])) {
    const el = it.layer && it.layer.getElement && it.layer.getElement();
    if (!el) continue;
    el.style.display = (worldState.visibleIds.has(it.nearId) && !fading.has(it.nearId))
      ? '' : 'none';
  }

  for (const [r, pane] of Object.entries(panes)) {
    pane.style.zIndex = selectedRegions.has(r) ? 340 : 300;
  }
  rebuildLegend();
  updateOverlapWarning();
  renderMarkers();
}

// One button per route. Ticking regions one at a time is the slow way to see a
// route, and it walks you through states the overlap warning has to complain
// about; a route is the unit that was stitched to fit together, so it should be
// the unit you can ask for.
function rebuildRoutes() {
  const box = document.getElementById('routeRows');
  if (!box || !worldState) return;
  box.innerHTML = '';
  REGION_ROUTES.forEach((route, i) => {
    // Only the regions this build actually has maps for.
    const have = route.filter(r => (worldState.byRegion[r] || []).length);
    if (!have.length) return;
    const on = have.every(r => selectedRegions.has(r)) && selectedRegions.size === have.length;
    const b = document.createElement('button');
    b.className = 'route-btn' + (on ? ' on' : '');
    b.textContent = routeLabel(i);
    b.title = have.map(regionLabel).join(' · ');
    b.onclick = () => {
      selectedRegions.clear();
      for (const r of have) selectedRegions.add(r);
      applySelection();
    };
    box.appendChild(b);
  });
}

function rebuildLegend() {
  rebuildRoutes();
  const rows = document.getElementById('regionRows');
  if (!rows || !worldState) return;
  rows.innerHTML = '';
  const entries = Object.entries(worldState.byRegion)
    .filter(([, v]) => v.length)
    .sort((a, b) => regionRank(a[0]) - regionRank(b[0]) || a[0].localeCompare(b[0]));
  for (const [r, items] of entries) {
    const on = selectedRegions.has(r);
    const extra = (EDGE_FADE[r] ? Object.keys(EDGE_FADE[r]).length
                                : 0);
    const row = document.createElement('div');
    row.className = 'rl-row' + (on ? ' focused' : '');
    row.innerHTML = `<span class="sw" style="background:${REGION_COLORS[r] || '#888'}"></span>` +
      `<span class="nm">${on ? '☑' : '☐'} ${regionLabel(r)}</span>` +
      `<span class="ct">${items.length}${extra ? ' +' + extra : ''}</span>`;
    row.title = extra ? `${items.length} maps, ${extra} fading at the edge` : `${items.length} maps`;
    row.onclick = () => {
      if (selectedRegions.has(r)) selectedRegions.delete(r); else selectedRegions.add(r);
      applySelection();
    };
    rows.appendChild(row);
  }
}

// The layout stitches every region into one plane, and the regions were never
// all laid out to sit side by side — but they were not laid out at random
// either. They form routes out of Vast Forest, and everything along one route
// was placed to butt against its neighbour, so a whole route can be shown at
// once without anything colliding. Two regions from *different* routes occupy
// the same ground, and no amount of pane ordering fixes that.
//
// Vast Forest is the hub, so it sits on every route and always pairs cleanly.
// Regions absent here (Faraway, Forest Playground) have no maps in the layout
// and cannot collide with anything.
// Which maps belong to only one playthrough. The two routes diverge late and
// the difference is not cosmetic: someone on SUNNY will never see the LOST
// LIBRARY, and someone on HIKIKOMORI will never see the ABYSS or BOSS RUSH, so
// a marker there is a place they cannot go. `both` is the default and hides
// nothing.
//
// This is a hand-written list, because nothing in the game data says which
// route a map belongs to — extend it as you find more. Item-level differences
// are not covered yet: that needs a list of which pickups exist on which route,
// and there is no way to derive one.
// Everything here is extra content only the HIKIKOMORI route reaches, so it is
// SUNNY that has things hidden from it, not the other way round.
const ROUTE_ONLY = {
  hikikomori: new Set([
    '440', '441', '443',                                  // LOST LIBRARY 1-3
    '201', '253', '254', '255', '256', '257', '258',      // ENTRANCE TO ABYSS, THE ABYSS, ABYSS LOWER 1-4, ABYSS FINAL
    '244',                                                // BOSS RUSH LOBBY
  ]),
};
const ROUTE_ONLY_REGIONS = { hikikomori: new Set(['snowglobe_mountain']) };
let routeMode = 'both';       // 'both' | 'sunny' | 'hikikomori'

// True when this map exists on some route other than the one being played.
function offRoute(id, region) {
  if (routeMode === 'both') return false;
  for (const route of Object.keys(ROUTE_ONLY)) {
    if (route === routeMode) continue;
    if (ROUTE_ONLY[route].has(String(id))) return true;
    if ((ROUTE_ONLY_REGIONS[route] || new Set()).has(region)) return true;
  }
  return false;
}

const REGION_ROUTES = [
  ['vast_forest', 'otherworld', 'junkyard', 'snowglobe_mountain'],
  ['vast_forest', 'deep_well', 'last_resort', 'deeper_well', 'humphrey', 'white_space'],
  ['vast_forest', 'pyrefly_forest', 'sweethearts_castle'],
  ['vast_forest', 'orange_oasis'],
];
// Named after the region each route runs out to, so they follow REGION_NAMES.
const ROUTE_ANCHORS = ['otherworld', 'deep_well', 'pyrefly_forest', 'orange_oasis'];
const routeLabel = i => i === 3 ? regionLabel(ROUTE_ANCHORS[3])
  : (LANG === 'zh' ? regionLabel(ROUTE_ANCHORS[i]) + t('routeSuffix')
                   : regionLabel(ROUTE_ANCHORS[i]) + ' ' + t('routeSuffix'));

// Which mix is on screen, as a stable string. The popup reappears when this
// changes and not merely when applySelection() runs again — every marker
// toggle and every fade recalculation goes through here, and a dialog that
// came back each time would be unusable.
let lastOverlapKey = null;
// The last selection that sat inside a single route. "Back to one route" used
// to throw the lot away and leave you on Vast Forest alone, so a mis-click cost
// you every region you had built up; now it just undoes the one that clashed.
let lastGoodRegions = null;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('overlapPopup')?.classList.remove('show');
});

function updateOverlapWarning() {
  const box = document.getElementById('overlapWarn');
  const popup = document.getElementById('overlapPopup');
  if (!box) return;
  const sel = [...selectedRegions];
  const label = r => (document.querySelector(`#regionSelect option[value="${r}"]`) || {}).textContent || r;
  // Fine as long as some one route contains everything selected.
  const fits = REGION_ROUTES.some(route => sel.every(r => route.includes(r)));
  const known = new Set(REGION_ROUTES.flat());
  if (fits || sel.every(r => !known.has(r))) {
    box.style.display = 'none';
    if (popup) popup.classList.remove('show');
    lastOverlapKey = null;
    lastGoodRegions = new Set(selectedRegions);
    return;
  }

  // Name the routes being mixed, so the fix is obvious.
  const involved = REGION_ROUTES
    .map((route, i) => [ROUTE_LABELS[i], sel.filter(r => r !== 'vast_forest' && route.includes(r))])
    .filter(([, rs]) => rs.length);
  const routeList = involved
    .map(([name, rs]) => `<b>${name}:</b> ${rs.map(label).join(', ')}`).join('<br>');
  const why = t('ovWhy');

  box.style.display = '';
  box.innerHTML =
    `<b>${t('ovTitle')(involved.length)}</b><br>${routeList}<br>${why}` +
    `<br><b>${t('ovTip')}</b> ${t('ovTipText')}`;

  if (!popup) return;
  const key = involved.map(([name, rs]) => name + ':' + rs.slice().sort().join(',')).join('|');
  if (key === lastOverlapKey) return;   // same mix, already answered for
  lastOverlapKey = key;
  popup.innerHTML =
    `<h5>${t('ovTitle')(involved.length)}</h5>` +
    `<div class="routes">${routeList}</div>` +
    `<div>${why} <b>${t('ovWarn')}</b></div>` +
    `<div class="acts">` +
      `<button class="primary" data-act="dismiss">${t('ovShow')}</button>` +
      `<button data-act="reset">${lastGoodRegions && lastGoodRegions.size
        ? t('ovUndo') + ' ' + [...lastGoodRegions].map(label).join(LANG === 'zh' ? '、' : ', ')
        : t('ovOne')}</button>` +
    `</div>`;
  popup.classList.add('show');
  popup.querySelector('[data-act="dismiss"]').onclick = () => popup.classList.remove('show');
  popup.querySelector('[data-act="reset"]').onclick = () => {
    popup.classList.remove('show');
    if (lastGoodRegions && lastGoodRegions.size) {
      selectedRegions.clear();
      for (const r of lastGoodRegions) selectedRegions.add(r);
      applySelection();
    } else {
      resetWorldLayers();
    }
  };
}

function resetWorldLayers() {
  selectedRegions.clear();
  selectedRegions.add(DEFAULT_WORLD_REGION);
  applySelection();
}

// Wheel behaviour copied from the stitcher: swipe to pan, pinch or cmd-wheel
// to zoom around the pointer, 1.08x per notch. Leaflet zoom levels are a log2
// scale, so that factor is log2(1.08) of a level.
const ZOOM_STEP = Math.log2(1.08);
function setupStitcherStyleWheel() {
  const el = leafletMap.getContainer();
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const at = leafletMap.containerPointToLatLng(leafletMap.mouseEventToContainerPoint(e));
      const z = leafletMap.getZoom() + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP);
      leafletMap.setZoomAround(at, z, { animate: false });
    } else {
      leafletMap.panBy([e.deltaX, e.deltaY], { animate: false });
    }
  }, { passive: false });
}

// ─────────────────────────── Region / mode ───────────────────────────
async function loadRegion(region) {
  currentRegion = region;

  const [metaRes, edgesRes, hlRes] = await Promise.all([
    fetchData(`../data/${region}_maps.json`),
    fetchData(`../data/${region}_edges.json`),
    fetchData(`../data/${region}_highlights.json`).catch(() => null),
  ]);
  mapMeta = await metaRes.json();
  edges = await edgesRes.json();
  highlights = hlRes && hlRes.ok ? await hlRes.json() : { watermelons: [] };

  // Per-map dropdown
  const sel = document.getElementById('mapSelect');
  sel.innerHTML = '';
  const sortedIds = Object.keys(mapMeta).sort((a, b) => +a - +b);
  for (const id of sortedIds) {
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = `Map${id}: ${mapMeta[id].name}`;
    sel.appendChild(opt);
  }
  // Variant dropdown for stitched mode
  const vsel = document.getElementById('variantSelect');
  vsel.innerHTML = '';
  const variants = STITCHED_VARIANTS[region] || [];
  for (const v of variants) {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v || '(default)';
    vsel.appendChild(opt);
  }

  if (currentMode === 'perMap') {
    sel.value = REGION_DEFAULTS[region]?.firstMap || sortedIds[0];
    loadMap(sel.value);
  } else {
    if (variants.length) loadStitched(region, variants[0]);
    else {
      clearLayers();
      document.getElementById('mapInfo').textContent = `No stitched layout for ${region} yet — use the stitcher to make one.`;
    }
  }
}

function setMode(mode) {
  currentMode = mode;
  document.body.classList.toggle('stitched', mode === 'stitched');
  document.body.classList.toggle('world', mode === 'world');
  document.getElementById('modePerMap').classList.toggle('active', mode === 'perMap');
  document.getElementById('modeStitched').classList.toggle('active', mode === 'stitched');
  document.getElementById('modeWorld').classList.toggle('active', mode === 'world');
  if (mode === 'world') loadWorld();
  else loadRegion(currentRegion);
}

async function init() {
  // First thing, and from inside init() rather than beside the table itself:
  // applyLang() reads ALL_REGIONS and regionLabel, which are declared further
  // down the file and would still be in the temporal dead zone up there.
  applyLang();
  leafletMap = L.map('map', {
    crs: L.CRS.Simple, minZoom: -7, maxZoom: 3, attributionControl: false,
    // Continuous zoom, and the wheel handled below rather than by Leaflet, so
    // this behaves like the stitcher: a two-finger swipe pans and only a pinch
    // or cmd-wheel zooms. Leaflet's default turns every swipe into a zoom,
    // which fights you the moment the world is bigger than the screen.
    zoomSnap: 0, zoomDelta: 0.25, scrollWheelZoom: false,
  });
  setupStitcherStyleWheel();
  // Icon sizes are tied to the zoom, so they have to be rebuilt when it moves.
  leafletMap.on('zoomend', () => renderMarkers());

  // Both files cover the whole game rather than one region, so they load once
  // and stay. A missing file just means those layers stay empty.
  let pngManifest, names;
  [collectibles, conveyors, pointSprites, melonArt, pngManifest, names] = await Promise.all([
    fetchData('../data/collectibles.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetchData('../data/conveyors.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetchData('../data/point_sprites.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetchData('../data/melon_art.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetchData('../data/raw_pngs/manifest.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetchData('../data/names_zh.json').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  pngVersion = pngManifest || {};
  zhNames = (names || {}).names || {};
  renderMarkerPanel();

  document.getElementById('mapSelect').addEventListener('change', e => loadMap(e.target.value));
  document.getElementById('regionSelect').addEventListener('change', e => loadRegion(e.target.value));
  document.getElementById('variantSelect').addEventListener('change', e => loadStitched(currentRegion, e.target.value));
  document.getElementById('modePerMap').addEventListener('click', () => setMode('perMap'));
  document.getElementById('modeStitched').addEventListener('click', () => setMode('stitched'));
  document.getElementById('modeWorld').addEventListener('click', () => setMode('world'));
  document.getElementById('regionReset').addEventListener('click', resetWorldLayers);
  document.getElementById('routeModeSel').addEventListener('change', e => {
    routeMode = e.target.value;
    renderMarkerPanel();
    applySelection();
  });
  // The header button is a shortcut to the watermelon row in the marker panel;
  // both drive the same flag, so they cannot disagree.
  document.getElementById('clearCollected').addEventListener('click', () => {
    if (!collected.size) return;
    if (!confirm(LANG === 'zh' ? `清除全部 ${collected.size} 个已收集标记？`
                               : `Clear all ${collected.size} collected marks?`)) return;
    collected.clear(); saveCollected(); renderMarkers();
  });
  // Sliders — re-render route overlay on input (cheap, only the overlay layers)
  const dot = document.getElementById('dotSize');
  const line = document.getElementById('lineWidth');
  dot.addEventListener('input', () => {
    dotSize = +dot.value; document.getElementById('dotSizeVal').textContent = dotSize;
    renderRoutesOverlay();
  });
  line.addEventListener('input', () => {
    lineWidth = +line.value; document.getElementById('lineWidthVal').textContent = lineWidth;
    renderRoutesOverlay();
  });

  const hash = location.hash.replace('#', '');
  const region = REGION_DEFAULTS[hash] ? hash : 'faraway';
  document.getElementById('regionSelect').value = region;
  await loadRegion(region);
}

init();
</script>
