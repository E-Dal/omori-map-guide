<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OMORI Map Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd; }
  header { padding: 8px 16px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header select, header input[type=range] { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 8px; }
  header label { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; }
  header input[type=range] { padding: 0; width: 100px; vertical-align: middle; }
  .view-toggle { display: inline-flex; border: 1px solid #444; border-radius: 4px; overflow: hidden; }
  .view-toggle button { background: #2a2a2a; color: #ddd; border: 0; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .view-toggle button.active { background: #ff80c0; color: #000; }
  #map { width: 100vw; height: calc(100vh - 50px); background: #0a0a0a; }
  .leaflet-container { background: #0a0a0a; }
  .map-event-marker {
    background: #ff4080; border: 2px solid #fff; border-radius: 50%;
    width: 16px; height: 16px;
  }
  @keyframes pinPulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.08 } }
  .melon-icon.blink, .pin.blink { animation: pinPulse 2.4s ease-in-out infinite; }
  .melon-icon {
    width: 24px; height: 24px;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    filter: drop-shadow(0 0 2px #000);
  }
  .melon-icon.green { background-image: url('assets/watermelon.png'); }
  .melon-icon.blue  { background-image: url('assets/watermelon_blue.png'); }
  .leaflet-tooltip.melon-tooltip {
    background: rgba(20,20,20,0.92); color: #fff; border: 1px solid #ff80c0;
    font-size: 12px; padding: 4px 8px;
  }
  .leaflet-tooltip.melon-tooltip::before { border-right-color: #ff80c0; }
  /* Collectible markers. Emoji rather than art so a new layer costs nothing,
     and sized from a per-layer slider so a dense layer can be shrunk out of
     the way without hiding it. */
  .pin { display: flex; align-items: center; justify-content: center;
         line-height: 1; filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 4px #000); }
  /* Sprites are 32px art; let them enlarge as pixels rather than blur. */
  .pin img { image-rendering: pixelated; display: block; }
  .pin.machine { cursor: pointer; transition: transform .12s ease; }
  .pin.machine:hover { transform: scale(1.25); }
  .pin.machine.flipped { filter: drop-shadow(0 0 3px #ffd050) drop-shadow(0 0 7px #ff8000); }
  /* Ticked off: greyed, faded, and stamped, so a copy of a sprite still on the
     map reads as "had it" rather than as a second one lying there. */
  .pin.done, .melon-icon.done { filter: grayscale(1) brightness(0.65) drop-shadow(0 0 2px #000); opacity: 0.55; }
  .pin.done::after, .melon-icon.done::after {
                     content: '✓'; position: absolute; right: -3px; bottom: -5px;
                     font-size: 11px; color: #7fdc7f; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  /* A ticked melon stops pulsing: a marker that is still waving for attention
     reads as "go and get this" whatever colour it has been turned. */
  .melon-icon.done { animation: none; }
  .pin, .melon-icon { position: relative; }
  .collectBubble { font-size: 12px; line-height: 1.5; }
  .collectBubble .where { color: #888; }
  /* What has to be true before the thing is in the world at all. Worth its own
     colour: a marker over bare ground reads as the guide being wrong until you
     know the item has not spawned yet. */
  .clue { display: block; margin-top: 4px; color: #9fd4ff; font-style: italic; }
  .needs { display: block; margin-top: 4px; color: #ffcf6a; }
  .needs b { color: #ffd97a; }
  .legend-note { margin-top: 8px; border-top: 1px solid #3a3a3a; padding-top: 6px;
                 color: #8d8d8d; font-size: 10px; line-height: 1.45; max-width: 200px; }
  .legend-note b { color: #ffcf6a; }
  .collectBubble button { display: block; margin-top: 7px; width: 100%; cursor: pointer;
    background: #2f7a3f; color: #fff; border: 0; border-radius: 3px; padding: 5px 8px; font-size: 12px; }
  .collectBubble button.done { background: #555; }

  #markerLegend {
    position: absolute; top: 60px; right: 10px; z-index: 700;
    background: rgba(18,18,20,0.88); border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; backdrop-filter: blur(3px);
  }
  #markerLegend h4 { margin: 0 0 6px; font-size: 11px; color: #888; font-weight: normal;
                     display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  #markerLegend h4 button { background: #2f2f2f; color: #bbb; border: 1px solid #4a4a4a;
                            font-size: 10px; padding: 1px 6px; border-radius: 3px; cursor: pointer; }
  #markerLegend h4 button:hover { color: #fff; border-color: #777; }
  #markerLegend .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #markerLegend .row label { display: flex; align-items: center; gap: 5px; cursor: pointer;
                             width: 132px; color: #ccc; }
  #markerLegend .row.off label { color: #666; }
  #markerLegend .row input[type=range] { width: 62px; }
  #markerLegend .count { color: #777; font-size: 10px; min-width: 26px; text-align: right; }
  #markerLegend .blinkBtn { background: none; border: 0; cursor: pointer; font-size: 11px;
                            color: #555; padding: 0 1px; }
  #markerLegend .blinkBtn.on { color: #ffd97a; }

  /* Hide elements not relevant to current mode */
  body.stitched .perMap-only { display: none; }
  body:not(.stitched) .stitched-only { display: none; }
  body.world .perMap-only, body.world .stitched-only { display: none; }
  body:not(.world) .world-only { display: none; }

  /* ── World view: one pane per region ── */
  /* Regions overlap by design, so an unfocused one drops to grey and stays as
     context. The focused one keeps its colour and rises above the pile. */
  #markerRows .group-head { margin: 7px 0 2px; padding-top: 6px;
                           border-top: 1px solid #333; font-size: 10px;
                           letter-spacing: .04em; color: #999; }
  #markerRows .group-head label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  /* ── First-visit notice ──────────────────────────────────────────────
     What the atlas does not do yet. Shown once per browser (localStorage),
     reopened any time from the ⓘ button in the header. Not a Leaflet popup:
     it has to sit above the panels, which live at z-index 700. */
  #introBack { position: fixed; inset: 0; z-index: 1200; display: none;
               background: rgba(0,0,0,0.62); backdrop-filter: blur(2px); }
  body.intro-open #introBack { display: flex; align-items: center; justify-content: center; }
  #introBox { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px);
              overflow-y: auto; background: #1d1d20; border: 1px solid #4a4a4a;
              border-radius: 8px; padding: 18px 20px 16px;
              box-shadow: 0 10px 40px rgba(0,0,0,0.6); font-size: 13px; line-height: 1.6; }
  #introBox h2 { margin: 0 0 2px; font-size: 16px; color: #ffd97a; font-weight: normal; }
  #introBox .lang { float: right; display: inline-flex; border: 1px solid #444;
                    border-radius: 4px; overflow: hidden; margin: -2px 0 0 10px; }
  #introBox .lang button { background: #262629; color: #999; border: 0;
                           font-size: 11px; padding: 3px 9px; cursor: pointer; }
  #introBox .lang button.on { background: #ffd97a; color: #1a1a1a; }
  /* English runs longer than the Chinese, so give the box a little more room
     and let the list breathe rather than reflowing when the language flips. */
  #introBox[lang=en] li { margin-bottom: 10px; }
  #introBox .sub { color: #8d8d8d; font-size: 11px; margin-bottom: 12px; }
  #introBox ol { margin: 0; padding-left: 20px; }
  #introBox li { margin-bottom: 9px; color: #ccc; }
  #introBox li b { color: #fff; font-weight: 600; }
  #introBox .k { color: #ff9ecb; }
  #introBox a { color: #80c0ff; }
  #introBox .foot { display: flex; align-items: center; gap: 12px;
                    margin-top: 14px; padding-top: 12px; border-top: 1px solid #333; }
  #introBox .foot label { font-size: 11px; color: #8d8d8d; display: flex;
                          align-items: center; gap: 5px; cursor: pointer; }
  #introOk { margin-left: auto; background: #2f7a3f; color: #fff; border: 0;
             border-radius: 4px; padding: 6px 18px; font-size: 13px; cursor: pointer; }
  #introOk:hover { background: #389049; }
  #introBtn { background: #2a2a2a; color: #bbb; border: 1px solid #444; border-radius: 4px;
              font-size: 12px; padding: 4px 9px; cursor: pointer; }
  #introBtn:hover { color: #fff; border-color: #777; }
  .lang-pick { display: inline-flex; border: 1px solid #444; border-radius: 4px; overflow: hidden; }
  .lang-pick button { background: #2a2a2a; color: #999; border: 0; font-size: 11px;
                      padding: 4px 8px; cursor: pointer; }
  .lang-pick button:hover { color: #ddd; }
  .lang-pick button.on { background: #ffd97a; color: #1a1a1a; }

  /* No max-width here and the panel shrink-wraps to this one long line — the
     rows are ~240px, the credit sentence is ~800px. Keep it boxed like .legend-note. */
  .credits { margin-top: 9px; padding-top: 7px; border-top: 1px solid #2c2c2c;
             max-width: 200px;
             font-size: 9px; line-height: 1.5; color: #6d6d6d; }
  .credits a { color: #8a8a8a; }
  .credits a:hover { color: #bbb; }
  #routeMode { font-size: 10px; color: #888; margin: 2px 0 6px; }
  #routeMode select { background: #2a2a2a; color: #ddd; border: 1px solid #444;
                      font-size: 10px; padding: 1px 3px; margin-left: 4px; }
  #routeRows { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 7px; }
  .route-btn { background: #2a2a2a; color: #bbb; border: 1px solid #444; border-radius: 3px;
               font-size: 10px; padding: 3px 7px; cursor: pointer; white-space: nowrap; }
  .route-btn:hover { background: #363636; color: #eee; }
  .route-btn.on { background: #3a4a3a; border-color: #6a8a6a; color: #cfe8cf; }
  .region-pane { transition: filter .18s ease; }
  /* Decorations deliberately do NOT get image-rendering: pixelated, even though
     stitcher_all.html draws them that way (.placed-deco): nearest-neighbour
     downsampling drops texels rather than averaging them, and the field of 166
     overlapping trees comes out speckled with hard navy holes.

     This is NOT what causes the black outline people see around the Vast Forest
     trees at anything short of 1:1, and image-rendering has nothing to do with
     that. The trees there bridge a real 192px hole in the layout — map92 FOREST
     PLAYGROUND ends at x=6368 and map99 PINWHEEL FOREST EAST starts at x=6560,
     with nothing behind the gap — so what is behind the sprites is #map's own
     background. The stitcher keeps every map and decoration in one #world div
     and scales the lot with a single transform, so trees that touch at 1:1 keep
     touching at every zoom. Leaflet sizes and positions each overlay on its own
     in fractional CSS pixels, each rounds separately, hairline cracks open
     between neighbouring sprites, and the background leaks through them.

     Proof, if it ever needs re-checking: set #map's background to magenta and
     the "outline" comes back magenta. Repainting the sprite's transparent
     pixels changes nothing — Chrome composites premultiplied and never samples
     RGB where alpha is 0, so 32_bleed_deco_edges.py is insurance, not a fix. */
  .world-deco { image-rendering: auto; }
  .region-pane.dimmed { filter: grayscale(1) brightness(0.45) contrast(0.95); }
  .region-pane.hidden { display: none; }

  #regionLegend {
    position: absolute; top: 60px; left: 10px; z-index: 700;
    background: rgba(18,18,20,0.88); border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; max-height: calc(100vh - 90px); overflow-y: auto;
    backdrop-filter: blur(3px);
  }
  #regionLegend h4 { margin: 0 0 6px; font-size: 11px; color: #888; font-weight: normal;
                     display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  #regionLegend h4 button { background: #2f2f2f; color: #bbb; border: 1px solid #4a4a4a;
                            font-size: 10px; padding: 1px 6px; border-radius: 3px; cursor: pointer; }
  .rl-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; color: #ccc; cursor: pointer; }
  .rl-row:hover { color: #fff; }
  .rl-row .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .rl-row .nm { flex: 1; white-space: nowrap; }
  .rl-row .ct { color: #666; font-size: 10px; }
  .rl-row.focused { color: #ffd97a; font-weight: bold; }
  .rl-row.off .nm { color: #555; text-decoration: line-through; }
  .rl-row .eye { background: none; border: 0; color: #777; cursor: pointer; font-size: 11px; padding: 0 2px; }
  .rl-row .eye:hover { color: #fff; }
  #overlapWarn { margin-top: 8px; border-top: 1px solid #3a3a3a; padding-top: 6px;
                 color: #ffcf6a; font-size: 11px; line-height: 1.45; max-width: 210px; display: none; }
  #overlapWarn b { color: #ffd97a; }

  /* The same warning, but in the way. The panel note above is easy to miss —
     it is 210px wide, the colour of the rest of the legend, and sits under a
     region list long enough to scroll. Mixing routes silently draws two
     regions on the same ground, which reads as a bug rather than as a choice,
     so the first time a selection does it, say so where it cannot be walked
     past. It stays until dismissed, and comes back only if the mix changes. */
  #overlapPopup {
    position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 1200; width: min(420px, calc(100vw - 40px));
    background: rgba(26,22,16,0.97); border: 1px solid #a8792a; border-radius: 8px;
    padding: 12px 14px; font-size: 12px; line-height: 1.5; color: #ffe9bf;
    box-shadow: 0 10px 34px rgba(0,0,0,0.6); display: none;
  }
  /* Scoped to the world view: an id selector would otherwise outrank the
     .world-only rule above and leave the popup on screen in region mode. */
  body.world #overlapPopup.show { display: block; }
  #overlapPopup h5 { margin: 0 0 6px; font-size: 13px; color: #ffd97a; }
  #overlapPopup b { color: #ffd97a; }
  #overlapPopup .routes { margin: 6px 0; padding: 6px 8px; background: rgba(0,0,0,0.3);
                          border-radius: 4px; }
  #overlapPopup .acts { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
  #overlapPopup button { background: #2f2a20; color: #ffd97a; border: 1px solid #6d5a2e;
                         padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #overlapPopup button:hover { background: #3d3527; }
  #overlapPopup button.primary { background: #a8792a; color: #1a1a1a; border-color: #a8792a; }
  #overlapPopup button.primary:hover { background: #c08f36; }
</style>
</head>
<body>
<header>
  <h1>OMORI Map Guide</h1>
  <label><span data-i18n="region">Region</span>
    <select id="regionSelect"></select>
  </label>
  <span class="view-toggle">
    <button id="modePerMap" class="active" data-i18n="perMap">Per-Map</button>
    <button id="modeStitched" data-i18n="stitched">Stitched</button>
    <button id="modeWorld" data-i18n="world">🌍 World</button>
  </span>
  <select id="mapSelect" class="perMap-only"></select>
  <label class="stitched-only"><span data-i18n="variant">Variant</span>
    <select id="variantSelect"></select>
  </label>
  <label class="stitched-only"><span data-i18n="dot">Dot</span>
    <input type="range" id="dotSize" min="3" max="20" value="9" />
    <span id="dotSizeVal" style="width:24px;text-align:right">9</span>
  </label>
  <label class="stitched-only"><span data-i18n="line">Line</span>
    <input type="range" id="lineWidth" min="1" max="8" value="3" />
    <span id="lineWidthVal" style="width:24px;text-align:right">3</span>
  </label>
  <span id="mapInfo" style="color:#888;font-size:12px"></span>
  <span id="flipNote" style="color:#ffd050;font-size:12px"></span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px">
    <span class="lang-pick"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></span>
    <button id="introBtn" data-i18n-title="introBtnTitle" data-i18n="introBtn">ⓘ</button>
    <a href="stitcher_all.html" style="color:#80c0ff;font-weight:bold">★ Stitcher ↗</a>
  </span>
</header>
<div id="map"></div>
<!-- Say the limits out loud rather than letting people find them one by one.
     The forum post is still to come; its URL goes in INTRO_TEXT below. -->
<div id="introBack">
  <div id="introBox">
    <h2 id="introTitle"></h2>
    <div class="sub" id="introSub"></div>
    <ol id="introList"></ol>
    <div class="foot">
      <label><input type="checkbox" id="introAgain" /> <span id="introAgainTxt"></span></label>
      <button id="introOk"></button>
    </div>
  </div>
</div>
<div id="markerLegend">
  <h4><span data-i18n="markers">MARKERS</span> <button id="clearCollected" style="display:none" data-i18n="clear">clear</button></h4>
  <div id="markerRows"></div>
  <div class="legend-note" data-i18n-html="legendNote"></div>
  <!-- The map images are somebody else's work and the art is OMOCAT's; the
       README says so but nobody visiting the site reads the README. -->
  <div class="credits" data-i18n-html="credits"></div>
</div>
<div id="regionLegend" class="world-only">
  <h4><span data-i18n="regions">REGIONS</span> <button id="regionReset" data-i18n="reset">reset</button></h4>
  <div id="routeMode"><span data-i18n="route">Route:</span>
    <select id="routeModeSel">
      <option value="both" data-i18n="routeBoth">both</option>
      <option value="sunny">SUNNY</option>
      <option value="hikikomori">HIKIKOMORI</option>
    </select>
  </div>
  <div id="routeRows"></div>
  <div id="regionRows"></div>
  <div id="overlapWarn"></div>
</div>
<div id="overlapPopup" class="world-only">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TILE_PX = 32;

let mapMeta = null;
let edges = null;
let highlights = null;            // { watermelons: [...] }
let leafletMap = null;
let currentLayers = [];           // image overlay + exit markers + polylines
let melonLayers = [];             // marker + conveyor-overlay layers (cleared as a group)
let currentMapId = null;         // map shown in Per-Map view
let collectibles = null;          // { layers, points } from 23_extract_collectibles.js
let conveyors = null;             // { mapId: { groups } } from 22_extract_conveyors.js
let pointSprites = null;          // sprite key -> [w, h], from 28_extract_point_sprites.py
let melonArt = null;              // "<mapId>:<evId>" -> sprite rect, same script

// Every kind of pin the atlas can drop, each independently shown and sized.
// Watermelons come from the region highlight files and the rest from
// collectibles.json; machines come from conveyors.json and are the only ones
// you can click. Sizes are starting points — the sliders own them after that.
// `art` marks a layer drawn with the game's own sprite instead of an emoji.
// 25_extract_marker_sprites.py cuts those out of the sheets. `wide` keeps the
// machine's 2:1 frame from being squashed into a square.
// `blink` offers a slow pulse, for finding a pin in a crowded room.
const MARKER_LAYERS = [
  { key: 'route',   label: { en: 'Routes', zh: '路线' },        icon: '🔗', on: true,  size: 3 },
  { key: 'melon',   label: { en: 'Watermelons', zh: '西瓜' },   icon: '🍉', on: true,  size: 24, blink: false },
  { key: 'machine', label: { en: 'Belt machines', zh: '传送带' }, icon: '🔧', on: true,  size: 30,
    art: 'assets/machine.png', wide: 62 / 29 },
  // Mari's picnic blanket is the Headspace save point — her event warps you to
  // WHITE SPACE and back. One per map on 28 maps, so it costs almost nothing to
  // leave on, and a save point is worth knowing about before you need it.
  { key: 'picnic',  label: { en: 'Picnic (save)', zh: '野餐点（存档）' }, icon: '🧺', on: true,  size: 26 },
  { key: 'hangman', label: { en: 'HANGMAN keys', zh: '吊死鬼按键' },  icon: '⌨️', on: false, size: 24, art: 'hangman' },
  // The two NPC layers split on what the person hands over, not on who they
  // are — key items, charms and weapons here, food and drink below — so they
  // are named as a pair.
  { key: 'npc',     label: { en: 'NPC (quest)', zh: 'NPC（任务）' }, icon: '🧑', on: false, size: 24 },
  { key: 'quest',   label: { en: 'Quest items', zh: '任务道具' },   icon: '🎒', on: false, size: 24 },
  { key: 'charm',   label: { en: 'Charms', zh: '饰品' },        icon: '🧿', on: false, size: 24 },
  { key: 'weapon',  label: { en: 'Weapons', zh: '武器' },       icon: '🔪', on: false, size: 24 },
  // People who hand you something for talking to them. NPCs giving a KEY item
  // are already under NPC (quest); this is the other 61 — food, drink, bandages
  // — including Reuben behind the CLUB SANDWICH bar.
  { key: 'giver',   label: { en: 'NPC (item)', zh: 'NPC（物品）' }, icon: '🥤', on: false, size: 24 },
  // Both the shells lying on the ground and the people who hand clams over.
  // A player asking "where do I get clams" wants one answer, not two, and the
  // popup names the event either way — CLAM, CLAM SNOWFLAKE, Hoagie, Mari.
  // The one layer whose points can sit under another: Mari in PATH TO TRENCH
  // is a picnic *and* 500 clams, so she carries a pin from each.
  { key: 'clams',   label: { en: 'CLAMS', zh: '蚌币' },         icon: '🐚', on: false, size: 22 },
  { key: 'collect', label: { en: 'Collectibles', zh: '收集品' },  icon: '🗑️', on: false, size: 20 },
  { key: 'sparkle', label: { en: 'Sparkles', zh: '闪光' },      icon: '✨', on: false, size: 20 },
  // Both tie to achievements and both are once-only, so they tick off like the
  // rest. The Faraway mirrors carry no sprite of their own — their event is an
  // invisible trigger on a mirror painted into the map art — so those six fall
  // back to the emoji.
  // Three pickups in one corner of DEEPERWELL FALLS, and the collection the
  // HIKIKOMORI route is built around — worth its own toggle rather than being

function cropRect(crop, meta) {
  if (crop === 'top3')      return { y: 0,                  h: meta.height / 3 };
  if (crop === 'mid3')      return { y: meta.height / 3,    h: meta.height / 3 };
  if (crop === 'bot3')      return { y: meta.height * 2 / 3,h: meta.height / 3 };
  return                          { y: 0,                  h: meta.height };
}

// ── Watermelon helpers (per-map view + stitched view) ──
function melonMarker(lat, lng, m, cfg, height) {
  const px = height || (cfg && cfg.size) || 24;
  // A melon is picked up once and then it is gone, same as a HANGMAN key, so it
  // gets the same treatment: click to tick it off, and a ticked one greys out
  // instead of going on advertising itself. The melons arrive from the region
  // highlight files rather than collectibles.json, so the key is built here —
  // to the same layer:map:event shape everything else in `collected` uses.
  const key = pointKey({ layer: 'melon', mapId: m.mapId, evId: m.evId });
  const done = collected.has(key);
  const icon = L.divIcon({
    className: '',
    html: `<div class="melon-icon ${m.color || 'green'}${cfg && cfg.blink ? ' blink' : ''}` +
          `${done ? ' done' : ''}" style="width:${px}px;height:${px}px"></div>`,
    iconSize: [px, px], iconAnchor: [px / 2, px / 2],
  });
  const marker = L.marker([lat, lng], { icon });
  // kind is the game's word for the table it came out of: Item, Weapon, Armor.
  const prize = m.prize
    ? `<br><b>${t('prize' + m.prize.kind)}</b>${itemName(m.prize.itemName)}` : '';
  marker.bindTooltip(
    `<b>${m.name}</b><br>Map${m.mapId} @ (${m.x}, ${m.y})${prize}${requiresNote(m)}`,
    { className: 'melon-tooltip', direction: 'top', offset: [0, -8], sticky: false }
  );
  marker.bindPopup(collectBubble(m, key, `<b>${m.name}</b>`, prize));
  return marker;
}
// ── Marker layers ──
// A pin has to know three things: where a tile on some map lands on screen,
// whether that map is on screen at all, and which pane to draw into. Those are
// the only things that differ between the three views, so each view supplies
// them and everything downstream is shared.
function markerFrame() {
  if (currentMode === 'world' && worldState) {
    const { bbox, layout, visibleIds, regionOf } = worldState;
    const org = id => layout.layout[id];
    return {
      has: id => visibleIds.has(String(id)) && !!org(id),
      at: (id, x, y) => [bbox.ch - (org(id).y + y * TILE_PX + TILE_PX / 2 - bbox.minY),
                         org(id).x + x * TILE_PX + TILE_PX / 2 - bbox.minX],
      atPx: (id, px, py) => [bbox.ch - (org(id).y + py - bbox.minY),
                             org(id).x + px - bbox.minX],
      rect: (id, ox, oy, ow, oh) => {
        const bottom = bbox.ch - (org(id).y + oy + oh - bbox.minY);
        const left = org(id).x + ox - bbox.minX;
        return [[bottom, left], [bottom + oh, left + ow]];
      },
      // A map with no region has no pane of its own; say so rather than
      // handing back 'region-undefined', which is not a pane either.
      pane: id => (regionOf[id] ? 'region-' + regionOf[id] : undefined),
    };
  }
  if (currentMode === 'stitched' && stitchedState) {
    const { bbox, layout } = stitchedState;
    const org = id => layout.layout[id];
    return {
      has: id => !!org(id),
      at: (id, x, y) => [bbox.ch - (org(id).y + y * TILE_PX + TILE_PX / 2 - bbox.minY),
                         org(id).x + x * TILE_PX + TILE_PX / 2 - bbox.minX],
      atPx: (id, px, py) => [bbox.ch - (org(id).y + py - bbox.minY),
                             org(id).x + px - bbox.minX],
      rect: (id, ox, oy, ow, oh) => {
        const bottom = bbox.ch - (org(id).y + oy + oh - bbox.minY);
        const left = org(id).x + ox - bbox.minX;
        return [[bottom, left], [bottom + oh, left + ow]];
      },
      pane: () => undefined,
    };
  }
  if (currentMode === 'perMap') {
    const cur = currentMapId;
    const h = ((mapMeta[cur] || {}).height || 0) * TILE_PX;
    return {
      has: id => String(id) === String(cur),
      at: (id, x, y) => [h - (y * TILE_PX + TILE_PX / 2), x * TILE_PX + TILE_PX / 2],
      atPx: (id, px, py) => [h - py, px],
      rect: (id, ox, oy, ow, oh) => [[h - oy - oh, ox], [h - oy, ox + ow]],
      pane: () => undefined,
    };
  }
  return null;
}

// What has to have happened before this point exists, from 30_extract_
// requirements.py. The switch names are the game's own labels, kept verbatim:
// 'Q- Coffee Machine (Start)' is clearer than any paraphrase, and it is data
// rather than a guess. 117 of 501 points and 14 watermelons carry one — the TV
// girl's THINGAMABOB, DOOHICKEY and WHATCHAMACALLIT among them, which is why
// three sparkles that look like every other sparkle are not where the map says
// until you have taken her list.
function requiresNote(p) {
  const req = p && p.requires;
  if (!req || !req.length) return '';
  return `<span class="needs">🔒 <b>${t('needs')}</b> ${req.join(' + ')}</span>`;
}

// The game's own hint for a HANGMAN key, straight off the item's
// <BlackLetterClue> notetag — see 31_blackletter_clues.py. It is in whatever
// language the installed copy is, because that is where it was read from.
// Five of the 26 keys are on the map at all only because the clue said which
// event they were: A is the one beside the stump.
function clueNote(p) {
  if (!p || !p.clue) return '';
  return `<span class="clue">🔎 ${p.clue}</span>`;
}

// The bubble a tickable marker opens: what it is, and the one button that

function collectBubble(p, key, title, what) {
  const box = document.createElement('div');
