<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OMORI ALL-REGION Stitcher</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd;
         display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

  /* Sidebar */
  aside { background: #222; border-right: 1px solid #444; overflow-y: auto; padding: 8px; }
  aside h2 { margin: 4px 0 8px; font-size: 14px; color: #aaa; }
  .map-thumb { display: flex; gap: 8px; padding: 6px; margin-bottom: 4px;
               background: #2a2a2a; border-radius: 4px; cursor: grab; align-items: center; }
  .map-thumb:hover { background: #333; }
  .map-thumb.placed { opacity: 0.4; }
  .map-thumb img { width: 40px; height: 40px; object-fit: contain; background: #111; flex-shrink: 0; }
  .map-thumb .meta { font-size: 11px; line-height: 1.3; min-width: 0; }
  .map-thumb .meta .id { color: #ff80c0; font-weight: bold; }
  .map-thumb .meta .name { color: #aaa; word-break: break-word; }
  /* Collapsible house groups */
  .house-group { margin-top: 6px; }
  .house-group > summary {
    cursor: pointer; padding: 6px 8px; background: #2a2a2a;
    border-radius: 3px; font-size: 12px; color: #ffea7a;
    user-select: none; list-style: none;
  }
  .house-group > summary::before { content: '▶ '; font-size: 9px; }
  .house-group[open] > summary::before { content: '▼ '; }
  .house-group > summary:hover { background: #333; }
  .house-group .phase-group { margin: 4px 0 6px 12px; }
  .house-group .phase-group > summary {
    cursor: pointer; padding: 3px 6px; background: #252525;
    border-radius: 3px; font-size: 11px; color: #aac;
    user-select: none; list-style: none;
  }
  .house-group .phase-group > summary::before { content: '▶ '; font-size: 9px; }
  .house-group .phase-group[open] > summary::before { content: '▼ '; }
  .house-group .map-thumb { margin-left: 12px; padding: 4px; }
  .house-group .map-thumb img { width: 32px; height: 32px; }

  /* Toolbar */
  /* The bar holds more than fits at 1440, so it has to give somewhere. Letting
     each control break its own label is the worst of the choices: "Save layout
     (JSON)" becomes two lines, the hint text at the end becomes seven, and the
     bar stood 97px tall — 84px of it that one crushed hint — then grew again
     whenever the text changed, which is what made selecting a decoration shove
     the canvas down. Labels stay on one line and the bar wraps in whole rows
     instead, so its height only depends on how many controls there are. */
  .toolbar { padding: 6px; border-bottom: 1px solid #333; background: #1a1a1a;
             display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             font-size: 12px; }
  .toolbar > * { flex: 0 0 auto; }
  .toolbar button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 10px; cursor: pointer;
                    white-space: nowrap; }
  .toolbar button:hover { background: #333; }
  .toolbar input { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px; }
  /* Kept to one line and cut off rather than wrapped: its text changes as you
     select things, and a bar whose height answers to its own status text moves
     the canvas out from under the cursor. What gets cut is the tail of the
     shortcut reminder, which is also on the button tooltips. */
  .toolbar .info { color: #888; margin-left: auto; font-family: monospace;
                   flex: 1 1 0; min-width: 0; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }

  /* Canvas viewport */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #viewport { flex: 1; overflow: hidden; position: relative;
              background: #0a0a0a;
              background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
              background-size: 32px 32px;
              cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* Suppress browser-native text/image selection in the canvas area —
     that's what produced the dark blue tint over selected maps. */
  #viewport, #world, .placed-map, .marquee {
    user-select: none; -webkit-user-select: none; -moz-user-select: none;
    -webkit-user-drag: none;
  }
  #viewport ::selection { background: transparent; }
  .placed-map { position: absolute; cursor: move;
                background-repeat: no-repeat; }
  /* Selection outline does NOT scale with world zoom — uses --zoom CSS var
     set in applyTransform() so the indicator stays visible at any zoom level. */
  .placed-map.selected { outline: calc(3px / var(--zoom, 1)) solid #ffeb3b;
                         outline-offset: calc(-1px / var(--zoom, 1));
                         box-shadow: 0 0 calc(12px / var(--zoom, 1)) rgba(255,235,59,0.7);
                         z-index: 100; }
  .placed-map.selected.grouped { outline-color: #6ee7ff;
                                 box-shadow: 0 0 calc(12px / var(--zoom, 1)) rgba(110,231,255,0.7); }
  .marquee { position: absolute; pointer-events: none;
             border: 1.5px dashed #80c0ff;
             background: rgba(128,192,255,0.10);
             z-index: 9999; }
  .placed-map .label { position: absolute; left: 4px; top: 4px;
                        background: rgba(0,0,0,0.7); color: #fff;
                        padding: 2px 6px; font-size: 11px; border-radius: 3px;
                        pointer-events: none; }
  .placed-map .ctrl-bar { position: absolute; right: 4px; top: 4px;
                          background: rgba(0,0,0,0.8); border-radius: 3px;
                          display: flex; gap: 0; padding: 1px;
                          font-size: 10px; }
  .placed-map .ctrl-bar button { background: #444; color: #ddd; border: none;
                                 padding: 2px 6px; cursor: pointer; }
  .placed-map .ctrl-bar button:hover { background: #666; }
  .placed-map .ctrl-bar button.active { background: #ff80c0; color: #000; }
  .placed-map .ctrl-bar .sep { width: 1px; background: #222; margin: 0 2px; }

  /* ── Decorations ── */
  /* Loose art dropped on the canvas: scenery that is not a map. Same drag,
     selection, z-order and undo machinery as a placed map, so it stacks
     between maps rather than always sitting on top. The outline is green
     instead of yellow so it is obvious which of the two you grabbed.
     Controls live in the toolbar, not on the sprite — a 61px tree has no
     room for a button bar, and one drawn inside it would shrink with zoom. */
  .placed-deco { position: absolute; cursor: move;
                 background-repeat: no-repeat; background-size: 100% 100%;
                 image-rendering: pixelated; }
  .placed-deco.selected { outline: calc(3px / var(--zoom, 1)) solid #6eff9e;
                          outline-offset: calc(-1px / var(--zoom, 1));
                          box-shadow: 0 0 calc(12px / var(--zoom, 1)) rgba(110,255,158,0.7);
                          z-index: 100; }
  .placed-deco.flipped { transform: scaleX(-1); }

  .deco-menu { position: relative; display: inline-flex; }
  .deco-menu > #decoMenu { display: none; position: absolute; left: 0; top: 100%;
                           margin-top: 4px; z-index: 5000; min-width: 172px;
                           background: #242424; border: 1px solid #4a4a4a;
                           border-radius: 4px; padding: 4px;
                           box-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  .deco-menu.open > #decoMenu { display: block; }
  .deco-menu #decoMenu button { display: flex; width: 100%; align-items: center; gap: 8px;
                                background: transparent; border: none; color: #ddd;
                                padding: 5px 6px; text-align: left; border-radius: 3px; }
  .deco-menu #decoMenu button:hover { background: #383838; }
  .deco-menu #decoMenu img { width: 26px; height: 26px; object-fit: contain;
                             image-rendering: pixelated; flex-shrink: 0; }
  .deco-menu #decoMenu .dim { color: #777; font-size: 10px; }
  /* Floats over the canvas rather than living in the toolbar. The toolbar is a
     plain flex row with no wrap rule, so anything appearing in it squeezes the
     buttons until their labels break over several lines: revealing this strip
     there took the bar from 97px to 181px and shoved 84px of canvas off the
     bottom every time a tree was clicked. Down here it costs the canvas
     nothing, and it is still not *on* the sprite — a 61px tree has no room for
     a button bar, which is why these were put in the toolbar to begin with. */
  #decoCtrl { position: absolute; left: 10px; bottom: 10px; z-index: 400;
              display: inline-flex; gap: 2px; align-items: center;
              background: rgba(26,26,26,0.94); border: 1px solid #3a3a3a;
              border-radius: 4px; padding: 4px 6px; font-size: 12px;
              box-shadow: 0 3px 12px rgba(0,0,0,0.5); }
  #decoCtrl button { background: #2a2a2a; color: #ddd; border: 1px solid #444;
                     padding: 4px 10px; cursor: pointer; }
  #decoCtrl button:hover { background: #333; }
  #decoCtrl #decoSize { color: #6eff9e; font-family: monospace; min-width: 40px;
                        text-align: center; font-size: 11px; }

  /* Watermelon overlays — pulse + thick bright glow */
  .watermelon-overlay { position: absolute; width: 32px; height: 32px;
                        background-size: contain; image-rendering: pixelated;
                        background-repeat: no-repeat;
                        animation: melon-pulse 1.4s ease-in-out infinite;
                        pointer-events: none; z-index: 200; }
  .watermelon-overlay.green { background-image: url('assets/watermelon.png');
                              filter: drop-shadow(0 0 10px #6cff33)
                                      drop-shadow(0 0 22px #6cff33)
                                      drop-shadow(0 0 34px #6cff33); }
  .watermelon-overlay.blue  { background-image: url('assets/watermelon_blue.png');
                              filter: drop-shadow(0 0 10px #33ccff)
                                      drop-shadow(0 0 22px #33ccff)
                                      drop-shadow(0 0 34px #33ccff); }
  @keyframes melon-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  .watermelons-off .watermelon-overlay { display: none; }

  /* ── Region layers ── */
  .layer-hidden { display: none !important; }
  /* Dimmed regions stay legible as context but read as background. */
  .layer-dimmed { filter: grayscale(1) brightness(0.5) contrast(0.9); }
  /* The focused region lifts over the maps it overlaps, but has to stay under
     the overlays: watermelons 200, routes 250, route dots 260, selection 100. */
  .layer-focus { z-index: 50; }

  #layerPanel { margin: 10px 0 8px; border-top: 1px solid #444; padding-top: 8px; }
  #layerPanel h3 { margin: 0 0 6px; font-size: 12px; color: #aaa; font-weight: normal;
                   display: flex; justify-content: space-between; align-items: center; }
  #layerPanel h3 button { background: #333; color: #bbb; border: 1px solid #4a4a4a;
                          font-size: 10px; padding: 1px 6px; cursor: pointer; border-radius: 3px; }
  #layerPanel h3 button:hover { background: #444; color: #fff; }
  #overlapWarn { margin-top: 8px; border-top: 1px solid #3a3a3a; padding-top: 6px;
                 color: #ffcf6a; font-size: 11px; line-height: 1.45; display: none; }
  #overlapWarn b { color: #ffd97a; }
  .layer-row { display: flex; align-items: center; gap: 4px; font-size: 11px;
               padding: 2px 0; color: #ccc; }
  .layer-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-row .ct { color: #666; font-size: 10px; }
  .layer-row button { background: #2f2f2f; color: #999; border: 1px solid #454545;
                      cursor: pointer; border-radius: 3px; font-size: 11px;
                      width: 22px; height: 20px; line-height: 1; padding: 0; }
  .layer-row button:hover { background: #3d3d3d; color: #fff; }
  .layer-row button.on { background: #ff80c0; color: #000; border-color: #ff80c0; }
  .layer-row.off .nm { color: #5a5a5a; text-decoration: line-through; }

  /* Route annotations: pair of dots + dashed line, draggable + snappable.
     The wrapper has an enlarged hit area for easy clicking. */
  #routesSvg { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 250; overflow: visible; }
  .route-dot { position: absolute; width: 40px; height: 40px; border-radius: 50%;
               cursor: grab; z-index: 260;
               display: flex; align-items: center; justify-content: center;
               background: transparent; }
  .route-dot:active { cursor: grabbing; }
  .route-dot::before { content: ''; width: 18px; height: 18px; border-radius: 50%;
                       background: var(--col); border: 2px solid #fff;
                       box-shadow: 0 0 8px var(--col), 0 0 16px var(--col); }
  .route-kind { display: inline-flex; gap: 2px; }
  .route-kind button.on { background: #ff66d9; color: #000; }
  .route-dot.snapped::before { width: 22px; height: 22px; border-width: 3px; }
  .route-dot.selected::before { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--col); }
  .route-dot.snapped::after { content: '✓'; position: absolute; color: #fff;
                              font-size: 11px; font-weight: bold; text-shadow: 0 0 3px var(--col); }
</style>
</head>
<body>

<aside>
  <h2>ALL MAPS</h2>
  <select id="regionFilter" style="width:100%;margin-bottom:8px;background:#2a2a2a;color:#ddd;border:1px solid #444;padding:4px;font-size:12px">
    <option value="">— All regions —</option>
    <option value="faraway">Faraway Town</option>
    <option value="vast_forest">Vast Forest</option>
    <option value="orange_oasis">Orange Oasis</option>
    <option value="otherworld">Otherworld</option>
    <option value="junkyard">Junkyard</option>
    <option value="pyrefly_forest">Pyrefly Forest</option>
    <option value="sweethearts_castle">Sweethearts Castle</option>
    <option value="deep_well">Deep Well</option>
    <option value="deeper_well">Deeper Well</option>
    <option value="humphrey">Inside Humphrey</option>
    <option value="last_resort">Last Resort</option>
    <option value="forest_playground">Forest Playground</option>
  </select>
  <div id="layerPanel">
    <h3>LAYERS <button id="layerResetBtn" title="Show every region, clear focus">reset</button></h3>
    <div id="layerRows"></div>
    <div id="overlapWarn"></div>
  </div>
  <div id="thumbList"></div>
</aside>

<main>
  <div class="toolbar">
    <button id="saveBtn">Save layout (JSON)</button>
    <button id="loadBtn">Load layout</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" />
    <button id="exportBtn">Export PNG</button>
    <button id="autoBtn">⚡ Auto-Place</button>
    <button id="clearBtn">Clear all</button>
    <button id="resetBtn">Reset view</button>
    <button id="melonBtn">🍉 Watermelons</button>
    <span class="deco-menu" id="decoMenuWrap">
      <button id="decoBtn" title="Drop a decoration on the canvas">🌳 Decoration ▾</button>
      <div id="decoMenu"></div>
    </span>
    <button id="addRouteBtn">+ Route</button>
    <span class="route-kind">
      <button id="kindTwo"  disabled title="Two-way: plain line (default)">— 2-way</button>
      <button id="kindOne"  disabled title="One-way: arrow from first dot to second">→ 1-way</button>
      <button id="kindLoop" disabled title="Wrap-around: leave one edge, arrive at the other">↻ wrap</button>
      <button id="kindFlip" disabled title="Swap which end is the start">⇄</button>
      <button id="kindDash" disabled title="Solid / dashed line">┄</button>
    </span>
    <button id="snapBtn" title="Route dot snapping (S). Hold Alt while dragging to bypass.">🧲 Snap ✓</button>
    <button id="groupBtn" disabled>Group</button>
    <button id="ungroupBtn" disabled>Ungroup</button>
    <span class="info">
      zoom: <span id="zoomLabel">100%</span>
      &nbsp;|&nbsp;
      placed: <span id="placedLabel">0/0</span>
      <span id="selInfo" style="color:#ffeb3b;margin-left:8px"></span>
      &nbsp;|&nbsp;
      <span style="color:#666">drag · ←↑↓→ nudge · [ / ] back/front · Shift-click multi · Delete</span>
      &nbsp;|&nbsp;
      <span style="color:#666">maps from <a href="https://goats.dev/omori/" target="_blank"
        rel="noopener" style="color:#7a7a7a">goats.dev</a> · art © OMOCAT</span>
    </span>
  </div>
  <div id="viewport">
    <div id="world">
      <svg id="routesSvg"></svg>
    </div>
    <span id="decoCtrl" style="display:none">
      <button data-deco="smaller" title="Shrink (−25%)">−</button>
      <span id="decoSize">100%</span>
      <button data-deco="bigger" title="Grow (+25%)">+</button>
      <button data-deco="flip" title="Flip horizontally">⇄</button>
      <button data-deco="back" title="Send to back">↓</button>
      <button data-deco="front" title="Bring to front">↑</button>
      <span id="decoSnapHint" style="color:#777;font-size:10px;margin-left:6px"></span>
      <button data-deco="del" title="Delete (or press Delete)">✕</button>
    </span>
  </div>
</main>

// Returns the image URL for a map ID. House rooms (synthetic IDs like 'r15_0')
// use their pre-cropped PNG; regular maps use the standard raw_pngs path.
// ?fresh in the page URL forces every map image past the browser cache — see
// the same constant in index.html for why that is worth having.
const CACHE_BUST = /(^|[?&])fresh(=|&|$)/.test(location.search) ? `?v=${Date.now()}` : '';

// Each render's own modification time, out of data/raw_pngs/manifest.json, so a
// re-rendered map cannot keep being drawn from cache. `?fresh` still wins.
let pngVersion = {};
const stampPng = file => CACHE_BUST || (pngVersion[file] ? `?v=${pngVersion[file]}` : '');

function mapImageUrl(id) {
  const m = mapMeta?.[id];
  const file = (m && m.image) || `map${id}.png`;
  return `../data/raw_pngs/${file}${stampPng(file)}`;
}
let placed = {}; // mapId -> {x, y, crop}  (crop is 'full' | 'top3' | 'mid3' | 'bot3')

// ====== Decorations ======
// Scenery dropped on the canvas that is not a map. Add one here and it shows
// up in the dropdown; nothing else needs touching. `w`/`h` are the PNG's own
// pixel size, which is also scale 1 — the art is drawn at the same 32px-tile
// resolution as the maps, so native size is the size that matches them.
// The pinwheels are the three animation frames of `$DW_Pinwheel`, trimmed out
// of the character sheet. Map100 has eleven poles standing with no heads —
// the head is an event sprite and that map's PNG has no event sprites drawn on
// it at all — and three angles is enough that eleven of them do not read as
// eleven copies of one picture. Drop one so its middle sits on a pole's tip.
const DECORATIONS = [
  { key: 'tree_part',  label: 'Tree (partial)',  src: 'assets/decorations/tree_part.png',  w: 61, h: 65 },
  { key: 'tree_full',  label: 'Tree (full)',     src: 'assets/decorations/tree_full.png',  w: 61, h: 60 },
  { key: 'pinwheel',   label: 'Pinwheel',        src: 'assets/decorations/pinwheel.png',   w: 59, h: 59 },
  { key: 'pinwheel_2', label: 'Pinwheel (turn 2)', src: 'assets/decorations/pinwheel_2.png', w: 68, h: 69 },
  { key: 'pinwheel_3', label: 'Pinwheel (turn 3)', src: 'assets/decorations/pinwheel_3.png', w: 57, h: 56 },
];
const decoDef = key => DECORATIONS.find(d => d.key === key);
// [{uid, kind, x, y, zOrder, scale, flip}] — uid is a stable handle for the
// DOM node, because deleting one would otherwise renumber every index after it.
let decorations = [];
let decoSeq = 0;
const DECO_SCALE_STEP = 0.25, DECO_SCALE_MIN = 0.25, DECO_SCALE_MAX = 6;
// What ⌥ snaps a decoration to, per kind. An axis with a `phase` is absolute:
// it rounds onto the lane n·step + phase, wherever the sprite happened to be.
// An axis without one is relative: whole steps from where the sprite already
// is, so its own alignment survives untouched.
//
// The two kinds want opposite things. A pinwheel is a single object that has
// to land on one particular pole, and every pole on KITE KID stands at
// x ≡ 20 (mod 32) — so x is a lane, while y stays relative because the eight
// of them sit at five deliberate heights above their poles. Trees are the
// opposite: 166 of them in a dense lattice at x ≡ 1 (mod 32), where nothing
// matters except that the lattice stays a lattice, so both axes are relative
// and a whole tile at a time.
const DECO_SNAP = {
  pinwheel:   { x: { step: TILE_PX, phase: 20 }, y: { step: TILE_PX / 2 } },
  pinwheel_2: { x: { step: TILE_PX, phase: 20 }, y: { step: TILE_PX / 2 } },
  pinwheel_3: { x: { step: TILE_PX, phase: 20 }, y: { step: TILE_PX / 2 } },
};
const DECO_SNAP_DEFAULT = { x: { step: TILE_PX }, y: { step: TILE_PX } };
const decoSnap = kind => DECO_SNAP[kind] || DECO_SNAP_DEFAULT;
const snapAxis = (rule, origin, delta) => rule.phase === undefined
  ? origin + Math.round(delta / rule.step) * rule.step
  : Math.round((origin + delta - rule.phase) / rule.step) * rule.step + rule.phase;
let zoom = 0.5;
let panX = 0, panY = 0;

// Faraway's four street maps are 3 stripes stacked in one image (day / sunset /
// night), each stripe padded with black bands that must be trimmed off so the
// stripes butt up against their neighbours. [rows trimmed from top, from bottom]
// Values mirror stitcher_faraway.html — keep the two in sync.
const STREET_BLACK_BAND = {
  13:   { top3: [0,5], mid3: [1,1], bot3: [2,1] },  // PLAYER STREET
  22:   { top3: [0,7], mid3: [2,2], bot3: [3,0] },  // OTHER STREET
  31:   { top3: [0,8], mid3: [2,1], bot3: [5,1] },  // AUBREY STREET
  45:   { top3: [0,8], mid3: [2,1], bot3: [4,1] },  // BASIL STREET
  1031: { top3: [0,8], mid3: [2,1], bot3: [5,1] },  // AUBREY STREET [VANILLA RENDER] — same geometry as 31
};

// Only the maps above are 3-phase stripes. Detecting them by shape instead
// (height >= 60 and a multiple of 30, as the per-region stitchers do) also
// catches 11 ordinary tall maps — ORANGE OASIS 90x90, FROZEN FOREST 150x150,
// PHOTO FRAME 22x120 — and would slice each into thirds.
function isStripe(mapId) {
  return Object.prototype.hasOwnProperty.call(STREET_BLACK_BAND, String(mapId));
}

function defaultCrop(meta, id) {
  return isStripe(id) ? 'top3' : 'full';
}

function cropRect(crop, meta, id) {
  // Returns {y, h} in tiles for the crop window (top-left + height)
  let r;
  if (crop === 'top3')      r = { y: 0,                     h: meta.height / 3 };
  else if (crop === 'mid3') r = { y: meta.height / 3,       h: meta.height / 3 };
  else if (crop === 'bot3') r = { y: meta.height * 2 / 3,   h: meta.height / 3 };
  else                      r = { y: 0,                     h: meta.height };
  // Trim street black bands (top + bottom)
  const band = STREET_BLACK_BAND[id]?.[crop];
  if (band) { r.y += band[0]; r.h -= band[0] + band[1]; }
  return r;
}

// Z-order helpers
function allZOrders() {
  // Decorations share one z scale with the maps so a tree can be tucked behind
  // a map instead of always floating above the whole stack.
  return [...Object.values(placed), ...decorations].map(p => p.zOrder ?? 0);
}
function nextZOrder() {
  const zs = allZOrders();
  return zs.length === 0 ? 0 : Math.max(...zs) + 1;
}
function prevZOrder() {
  const zs = allZOrders();
  return zs.length === 0 ? 0 : Math.min(...zs) - 1;
}
function bringToFront(id) {
  if (!placed[id]) return;
  placed[id].zOrder = nextZOrder();
  renderPlaced();
  // restore selected highlight
  const el = world.querySelector(`.placed-map[data-id="${id}"]`);
  if (el) el.classList.add('selected');
}
function sendToBack(id) {
  if (!placed[id]) return;
  placed[id].zOrder = prevZOrder();
  renderPlaced();
  const el = world.querySelector(`.placed-map[data-id="${id}"]`);
  if (el) el.classList.add('selected');
}

let routes = [];

                     '#bb88ff', '#ff5566', '#22eebb', '#eeaa44', '#88ddff'];

// Topmost placed map covering a world point, or null. Overlapping regions are
// the normal state here, so "nearest snap target" alone would happily grab an
// event on a map buried three layers down. Whatever is drawn on top at the
// cursor is what the user is aiming at.
function topMapAt(wx, wy) {
  let topId = null, topZ = -Infinity;
  for (const id of Object.keys(placed)) {
    const m = mapMeta[id];
    if (!m) continue;
    const pos = placed[id];
    const cr = cropRect(pos.crop || 'full', m, id);
    if (wx < pos.x || wx >= pos.x + m.width * TILE_PX) continue;
    if (wy < pos.y || wy >= pos.y + cr.h * TILE_PX) continue;
    const z = pos.zOrder ?? 0;
    if (z >= topZ) { topZ = z; topId = id; }
  }
  return topId;
}

async function init() {
  const REGIONS = ["faraway", "junkyard", "orange_oasis", "snowglobe_mountain", "white_space", "otherworld", "pyrefly_forest", "sweethearts_castle", "vast_forest", "deep_well", "deeper_well", "humphrey", "last_resort", "forest_playground"];
  // no-cache on the manifest, not on the images: the point is to always know
  // the current mtimes so the image URLs themselves can be cached hard.
  pngVersion = await fetch('../data/raw_pngs/manifest.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : {}).catch(() => ({}));

  const responses = await Promise.all(REGIONS.flatMap(r => [
    fetch(`../data/${r}_maps.json`, { cache: 'no-cache' }),
    fetch(`../data/${r}_edges.json`, { cache: 'no-cache' }),
    fetch(`../data/${r}_highlights.json`, { cache: 'no-cache' }),
  ]));
  mapMeta = {}; edges = { internal: [], external: [] }; highlights = { watermelons: [] };
  for (let i = 0; i < REGIONS.length; i++) {
    const meta = await responses[i*3].json();
    Object.assign(mapMeta, meta);
    // Region per map, straight from the file each map arrived in. The static
    // REGION_OF_MAP below predates several sliced sub-maps (1322, 4212, the
    // CLUB SANDWICH rooms), which left them unfiltered in the thumbnail list
    // and ungrouped on import.
    for (const id of Object.keys(meta)) REGION_OF_MAP[id] = REGIONS[i];
    const eg = await responses[i*3+1].json();
    edges.internal.push(...(eg.internal || []));
    edges.external.push(...(eg.external || []));
    try { const hl = await responses[i*3+2].json();
      highlights.watermelons.push(...(hl.watermelons || []));
    } catch(e) {}
  }
  MAP_IDS = Object.keys(mapMeta).filter(k => /^\d+$/.test(k))
                                .map(Number).sort((a, b) => a - b);
  console.log(`Loaded ${Object.keys(mapMeta).length} maps, ${edges.internal.length} edges, ${highlights.watermelons.length} watermelons`);

  // Load sliced house interiors (Faraway). Each room becomes a synthetic map
  // entry with id like 'r15_0' (map15 room 0). The dropdown UI groups them.
  try {
    housesData = await fetch('../data/faraway_houses_sliced.json').then(r => r.json());
    for (const [houseName, phases] of Object.entries(housesData.houses)) {
      for (const [phase, info] of Object.entries(phases)) {
        for (const room of info.rooms) {
          const rid = `r${info.mapId}_${room.roomIdx}`;
          mapMeta[rid] = {
            name: `${houseName} (${phase}) — Room ${room.roomIdx}`,
            width: room.tw,
            height: room.th,
            image: room.file,
            _house: houseName,
            _phase: phase,
            _parentMapId: info.mapId,
            _roomIdx: room.roomIdx,
          };
          // Sliced house rooms carry string ids, so they miss the per-region
          // pass above; they are all Faraway interiors.
          REGION_OF_MAP[rid] = 'faraway';
        }
      }
    }
    const nRooms = Object.values(mapMeta).filter(m => m.image).length;
    console.log(`Loaded ${nRooms} house room images across ${Object.keys(housesData.houses).length} houses`);

    // Remap transfer events from each sliced parent map to its room rids,
    // so route snapping works on placed rooms. An event at tile (x,y) in the
    // parent map belongs to whichever room's bbox contains (x,y).
    const slicedMapToRooms = {};
    for (const phases of Object.values(housesData.houses)) {
      for (const info of Object.values(phases)) {
        slicedMapToRooms[String(info.mapId)] = info.rooms;
      }
    }
    const synthetic = [];
    // Doorway events often sit 1 tile outside the visible room interior
    // (the threshold is the floor pixel bbox; the teleport tile is on the wall).
    // So: first try strict containment; if none, fall back to nearest room within
    // a 2-tile tolerance, and clamp the local coord onto the room edge.
    const TOL = 2;
    for (const e of edges.internal) {
      const rooms = slicedMapToRooms[String(e.from.mapId)];
      if (!rooms) continue;
      let room = rooms.find(r =>
        e.from.x >= r.tx && e.from.x < r.tx + r.tw &&
        e.from.y >= r.ty && e.from.y < r.ty + r.th);
      if (!room) {
        let best = null, bestD = Infinity;
        for (const r of rooms) {
          const dx = Math.max(r.tx - e.from.x, 0, e.from.x - (r.tx + r.tw - 1));
          const dy = Math.max(r.ty - e.from.y, 0, e.from.y - (r.ty + r.th - 1));
          const d = Math.max(dx, dy);
          if (d <= TOL && d < bestD) { bestD = d; best = r; }
        }
        room = best;
      }
      if (!room) continue;
      const lx = Math.max(0, Math.min(room.tw - 1, e.from.x - room.tx));
      const ly = Math.max(0, Math.min(room.th - 1, e.from.y - room.ty));
      synthetic.push({
        ...e,
        from: { ...e.from, mapId: `r${e.from.mapId}_${room.roomIdx}`,
                x: lx, y: ly },
      });
    }
    edges.internal.push(...synthetic);
    console.log(`Added ${synthetic.length} remapped events for house rooms`);
  } catch (e) { console.warn('No faraway houses data:', e.message); }

  // Session restore is disabled — see the note below.
